# Add to Home Assistant's configuration.yaml, then restart.
#
# The panel calls the webhook, HA renders the next frame, the panel fetches it.
# Doing it in that order means the two never drift apart -- the frame is always
# rendered for the fetch that is about to happen.

shell_command:
  # The panel passes its own battery and signal so the footer is real and you
  # can alert on a panel that has stopped checking in.
  epaper_render: >-
    python3 /config/epaper/render.py --batt {{ batt | int(0) }} --rssi {{ rssi | int(0) }}
  epaper_render_page: >-
    python3 /config/epaper/render.py --page {{ page }}

automation:
  - alias: "E-paper: render next frame on panel request"
    id: epaper_render_next
    mode: queued
    max: 3
    triggers:
      - trigger: webhook
        webhook_id: epaper_next
        allowed_methods: [POST]
        local_only: true
    actions:
      - action: shell_command.epaper_render
        data:
          batt: "{{ trigger.json.batt | default(0) }}"
          rssi: "{{ trigger.json.rssi | default(0) }}"

  # e-ink holds its picture without power, so a dead panel looks exactly like a
  # working one. This is the only way you would ever notice.
  - alias: "E-paper: panel stopped checking in"
    id: epaper_watchdog
    triggers:
      - trigger: state
        entity_id: automation.epaper_render_next
        attribute: last_triggered
        for: "01:00:00"
    actions:
      - action: notify.persistent_notification
        data:
          title: E-paper panel
          message: No frame requested for an hour. Battery flat, or off the network.
