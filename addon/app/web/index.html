<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>E-paper panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='4' fill='%231d1d1f'/%3E%3Crect x='5' y='10' width='22' height='12' rx='1.5' fill='%23fbfbf9'/%3E%3Cpath d='M8 19h16' stroke='%231d1d1f' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/editor.css">
<script>
  // Before anything paints: your choice, or the system's.
  try {
    var t = localStorage.getItem("epaper_theme") || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header id="toolbar" class="toolbar" role="toolbar" aria-label="Editor"></header>
  <main class="workspace">
    <div id="stage" class="stage">
      <div id="canvasbar" class="canvasbar"></div>
      <div class="canvaswrap">
        <aside id="layers" class="layers" hidden aria-label="Layers"></aside>
        <div id="canvasarea" class="canvasarea"></div>
      </div>
      <nav id="strip" class="stripwrap" aria-label="Pages"></nav>
    </div>
    <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
  </main>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>
<p id="canvas-help" class="sr">Tab moves through the elements on this page. Arrow keys nudge the selection, Shift with an arrow moves 10 pixels. Press question mark for every shortcut.</p>
<datalist id="fscale-ticks"><option value="0.85"></option><option value="1"></option><option value="1.15"></option><option value="1.3"></option><option value="1.5"></option></datalist>
<noscript><p style="padding:24px;font:15px -apple-system,system-ui,sans-serif">The editor needs JavaScript.</p></noscript>
<script type="module" src="static/app/main.js"></script>
</body>
</html>
