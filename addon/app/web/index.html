<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-paper editor</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--line:#d9d8d2;--ink:#1a1a18;--mut:#6b6a64;--accent:#378add}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
select,input,button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{margin-left:auto;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
#stage{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
#canvas{position:relative;width:100%;aspect-ratio:792/272;background:#fff url("") no-repeat center/100% 100%;
        border:1px solid var(--line);user-select:none;touch-action:none}
.el{position:absolute;border:1.5px dashed rgba(0,0,0,.35);cursor:move}
.el.sel{border:2px solid var(--accent);background:rgba(55,138,221,.08)}
.guide{position:absolute;background:#e0439b;pointer-events:none;z-index:5}
.guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
#legib{margin-top:6px;font-size:12px}
#legib b{font-weight:600}
.warn{color:#b3261e}.ok{color:#1d7a4c}
.el .hd{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:var(--accent);
        border:2px solid #fff;border-radius:2px;cursor:nwse-resize}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row label{width:74px;color:var(--mut);font-size:13px;flex:none}
.row input,.row select{flex:1;min-width:0}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{font-size:13px}
#ents{max-height:190px;overflow:auto;font-size:12px}
#ents div{padding:4px 6px;border-radius:4px;cursor:grab;font-family:ui-monospace,monospace;font-size:11px}
#ents div:hover{background:#eef4fb}
small{color:var(--mut)}
@font-face{font-family:mdi;src:url("api/mdi/font") format("truetype")}
#pickwrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20}
#pick{background:#fff;border-radius:10px;padding:14px;width:min(620px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:10px}
#picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;overflow:auto}
#picks button{font-family:mdi;font-size:26px;line-height:1.5;padding:4px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#picks button span{font-family:system-ui,sans-serif;font-size:9px;color:var(--mut);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdiprev{font-family:mdi;font-size:20px;margin-left:6px}
</style>

<header>
  <select id="page"></select>
  <button id="addpage">+ page</button>
  <button id="delpage">delete</button>
  <select id="tier" title="When this page appears">
    <option value="rotate">in rotation</option>
    <option value="when">only when true</option>
    <option value="alert">interrupt only</option>
  </select>
  <button id="undo" title="Undo (Cmd/Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Cmd/Ctrl+Shift+Z)">↷</button>
  <button id="push" title="Make the panel fetch and redraw now">Push to panel</button>
  <button id="save" class="primary">Save</button>
  <span id="msg"></span>
</header>

<main>
  <div id="stage">
    <div id="canvas"></div>
    <div class="row" style="margin-top:10px">
      <label>show if</label>
      <input id="showif" placeholder="{{ is_state('timer.x','active') }} — blank means always">
    </div>
    <div class="row" id="holdrow" style="display:none">
      <label>hold for</label>
      <input id="hold" type="number" min="1" max="120" style="max-width:90px">
      <small>minutes on screen before it hands the panel back</small>
    </div>
    <small id="hint">Drag an entity onto the canvas, or add an element. Drag to move, corner to resize.</small>
  </div>

  <aside>
    <div class="card">
      <h3>Add element</h3>
      <div class="pal">
        <button data-add="number">Number</button>
        <button data-add="text">Text</button>
        <button data-add="icon">Icon</button>
        <button data-add="curve">Curve</button>
        <button data-add="line">Line</button>
      </div>
    </div>
    <div class="card">
      <h3>Entities</h3>
      <input id="search" placeholder="search…" style="width:100%;margin-bottom:6px">
      <div id="ents"></div>
    </div>
    <div class="card">
      <h3>Selected</h3>
      <div id="props"><small>Nothing selected.</small></div>
    </div>
  </aside>
</main>
<div id="pickwrap"><div id="pick">
  <div class="row" style="margin:0"><input id="picksearch" placeholder="search icons…" style="flex:1">
    <button id="pickclose">Close</button></div>
  <div id="picks"></div>
</div></div>

<script>
const W=792,H=272,SNAP=6;
let spec={rotation:[],pages:{}}, cur=null, sel=-1, ents=[], timer=null;
let hist=[], hpos=-1, metrics=[];
const $=id=>document.getElementById(id);
const canvas=$("canvas");
const api=(p,o)=>fetch(p,o).then(r=>r.ok?r:Promise.reject(new Error(r.status+" "+r.statusText)));
const msg=t=>{$("msg").textContent=t;if(t)setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},2500);};

/* ---------- history ---------- */
function snapshot(){
  hist=hist.slice(0,hpos+1);
  hist.push(JSON.stringify(spec));
  if(hist.length>60) hist.shift();
  hpos=hist.length-1; buttons();
}
function restore(i){
  if(i<0||i>=hist.length) return;
  hpos=i; spec=JSON.parse(hist[hpos]);
  if(!spec.pages[cur]) cur=Object.keys(spec.pages)[0];
  fillPages(); $("page").value=cur; sel=-1; paint(); preview(); buttons();
}
const undo=()=>restore(hpos-1), redo=()=>restore(hpos+1);
function buttons(){ $("undo").disabled=hpos<=0; $("redo").disabled=hpos>=hist.length-1; }

/* ---------- boot ---------- */
async function boot(){
  spec=await api("api/layouts").then(r=>r.json());
  ents=await api("api/entities").then(r=>r.json()).catch(()=>[]);
  drawEntities(""); fillPages(); snapshot();
  select(Object.keys(spec.pages)[0]);
}
const fillPages=()=>$("page").innerHTML=Object.keys(spec.pages).map(n=>`<option>${n}</option>`).join("");
const page=()=>spec.pages[cur];
const els=()=>page().elements||(page().elements=[]);

function select(name){
  cur=name; sel=-1; if(!cur) return;
  $("page").value=cur;
  $("tier").value=page().tier||"rotate";
  $("showif").value=page().show_if||"";
  $("hold").value=page().hold_minutes??10;
  holdRow();
  paint(); preview();
}

function paint(){
  canvas.querySelectorAll(".el,.guide").forEach(n=>n.remove());
  els().forEach((el,i)=>{
    const d=document.createElement("div");
    d.className="el"+(i===sel?" sel":"");
    d.style.left=(el.x/W*100)+"%"; d.style.top=(el.y/H*100)+"%";
    d.style.width=(el.w/W*100)+"%"; d.style.height=(el.h/H*100)+"%";
    d.dataset.i=i; d.innerHTML='<div class="hd"></div>';
    canvas.appendChild(d);
  });
  props();
}

function preview(){
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{
      const r=await api("api/preview",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({page:page(),label:cur})});
      try{ metrics=JSON.parse(r.headers.get("X-Metrics")||"[]"); }catch(_){ metrics=[]; }
      canvas.style.backgroundImage=`url(${URL.createObjectURL(await r.blob())})`;
      props();
    }catch(e){ msg("preview failed: "+e.message); }
  },220);
}

/* ---------- snapping ---------- */
function guides(el,i){
  const xs=[0,40,W/2,W-40,W], ys=[0,26,H/2,236,H];
  els().forEach((o,j)=>{ if(j!==i){ xs.push(o.x,o.x+o.w/2,o.x+o.w); ys.push(o.y,o.y+o.h/2,o.y+o.h); }});
  const hit=[];
  const near=(v,list)=>{ for(const t of list) if(Math.abs(v-t)<=SNAP) return t; return null; };
  let gx=null,gy=null;
  for(const [val,set] of [[el.x,"l"],[el.x+el.w/2,"c"],[el.x+el.w,"r"]]){
    const t=near(val,xs);
    if(t!==null){ el.x=Math.round(t-(set==="c"?el.w/2:set==="r"?el.w:0)); gx=t; break; }
  }
  for(const [val,set] of [[el.y,"t"],[el.y+el.h/2,"m"],[el.y+el.h,"b"]]){
    const t=near(val,ys);
    if(t!==null){ el.y=Math.round(t-(set==="m"?el.h/2:set==="b"?el.h:0)); gy=t; break; }
  }
  canvas.querySelectorAll(".guide").forEach(n=>n.remove());
  if(gx!==null){const g=document.createElement("div");g.className="guide v";g.style.left=(gx/W*100)+"%";canvas.appendChild(g);}
  if(gy!==null){const g=document.createElement("div");g.className="guide h";g.style.top=(gy/H*100)+"%";canvas.appendChild(g);}
}

function guidesResize(el,i){
  // Snap the far edges while resizing, so a second element can be made
  // flush with the first without nudging numbers.
  const xs=[40,W/2,W-40], ys=[26,H/2,236];
  els().forEach((o,j)=>{ if(j!==i){ xs.push(o.x,o.x+o.w); ys.push(o.y,o.y+o.h); }});
  const near=(v,list)=>{ for(const t of list) if(Math.abs(v-t)<=SNAP) return t; return null; };
  let gx=near(el.x+el.w,xs), gy=near(el.y+el.h,ys);
  if(gx!==null) el.w=Math.round(gx-el.x);
  if(gy!==null) el.h=Math.round(gy-el.y);
  canvas.querySelectorAll(".guide").forEach(n=>n.remove());
  if(gx!==null){const g=document.createElement("div");g.className="guide v";g.style.left=(gx/W*100)+"%";canvas.appendChild(g);}
  if(gy!==null){const g=document.createElement("div");g.className="guide h";g.style.top=(gy/H*100)+"%";canvas.appendChild(g);}
}

/* ---------- drag & resize ---------- */
let drag=null;
canvas.addEventListener("pointerdown",e=>{
  const box=e.target.closest(".el"); if(!box) return;
  sel=+box.dataset.i; paint();
  const scale=W/canvas.getBoundingClientRect().width;
  drag={i:sel,mode:e.target.classList.contains("hd")?"size":"move",
        sx:e.clientX,sy:e.clientY,el:{...els()[sel]},scale,moved:false};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.moved){ snapshot(); drag.moved=true; }
  const dx=(e.clientX-drag.sx)*drag.scale, dy=(e.clientY-drag.sy)*drag.scale;
  const el=els()[drag.i], o=drag.el;
  if(drag.mode==="move"){
    el.x=Math.max(0,Math.min(W-o.w,Math.round(o.x+dx)));
    el.y=Math.max(0,Math.min(H-o.h,Math.round(o.y+dy)));
    if(!e.altKey) guides(el,drag.i);
  }else{
    el.w=Math.max(16,Math.min(W-o.x,Math.round(o.w+dx)));
    el.h=Math.max(10,Math.min(H-o.y,Math.round(o.h+dy)));
    if(!e.altKey) guidesResize(el,drag.i);
  }
  canvas.querySelectorAll(".el").forEach(n=>{
    const q=els()[+n.dataset.i];
    n.style.left=(q.x/W*100)+"%"; n.style.top=(q.y/H*100)+"%";
    n.style.width=(q.w/W*100)+"%"; n.style.height=(q.h/H*100)+"%";
  });
  props();
});
canvas.addEventListener("pointerup",()=>{
  if(drag){ canvas.querySelectorAll(".guide").forEach(n=>n.remove()); drag=null; preview(); }
});

/* ---------- keyboard ---------- */
addEventListener("keydown",e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&e.key.toLowerCase()==="d"){ e.preventDefault(); duplicate(); return; }
  if(sel<0) return;
  if(e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); snapshot(); els().splice(sel,1); sel=-1; paint(); preview(); return; }
  const step=e.shiftKey?10:1, el=els()[sel];
  const map={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
  if(map[e.key]){
    e.preventDefault(); snapshot();
    el.x=Math.max(0,Math.min(W-el.w,el.x+map[e.key][0]));
    el.y=Math.max(0,Math.min(H-el.h,el.y+map[e.key][1]));
    paint(); preview();
  }
});
function duplicate(){
  if(sel<0) return; snapshot();
  const c={...els()[sel]}; c.x=Math.min(W-c.w,c.x+12); c.y=Math.min(H-c.h,c.y+12);
  els().push(c); sel=els().length-1; paint(); preview();
}

/* ---------- palette ---------- */
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
  snapshot();
  const t=b.dataset.add;
  const base={type:t,x:60,y:60,w:t==="line"?240:260,h:t==="line"?4:90};
  if(t==="number"){base.value="{{ states('sensor.example') }}";base.decimals=1;base.align="left";}
  if(t==="text"){base.value="label";base.size=30;base.bold=false;base.align="left";}
  if(t==="icon"){base.icon="mdi:home";base.w=110;base.h=110;}
  if(t==="curve"){base.entity="sensor.example";base.hours=24;}
  els().push(base); sel=els().length-1; paint(); preview();
});

/* ---------- entities ---------- */
$("search").oninput=e=>drawEntities(e.target.value);
function drawEntities(q){
  const f=ents.filter(e=>!q||e.entity_id.includes(q)||(e.name||"").toLowerCase().includes(q.toLowerCase())).slice(0,120);
  $("ents").innerHTML=f.map(e=>`<div draggable="true" data-e="${e.entity_id}" title="${e.name} — ${e.state}">${e.entity_id}</div>`).join("")||"<small>no match</small>";
  $("ents").querySelectorAll("div[data-e]").forEach(d=>d.ondragstart=ev=>ev.dataTransfer.setData("text/plain",d.dataset.e));
}
canvas.addEventListener("dragover",e=>e.preventDefault());
canvas.addEventListener("drop",e=>{
  e.preventDefault();
  const id=e.dataTransfer.getData("text/plain"); if(!id) return;
  snapshot();
  const r=canvas.getBoundingClientRect(), s=W/r.width;
  els().push({type:"number",value:`{{ states('${id}') }}`,decimals:1,align:"left",
              x:Math.round((e.clientX-r.left)*s),y:Math.round((e.clientY-r.top)*s),w:260,h:90});
  sel=els().length-1; paint(); preview();
});

/* ---------- properties ---------- */
function props(){
  const box=$("props");
  if(sel<0||!els()[sel]){box.innerHTML="<small>Nothing selected.</small>";return;}
  const el=els()[sel];
  const f=(k,label,type="text",ph="")=>`<div class="row"><label>${label}</label>
    <input data-k="${k}" type="${type}" placeholder="${ph}" value="${(el[k]??"").toString().replace(/"/g,"&quot;")}"></div>`;
  let h="";
  if(el.type==="number")h=f("value","value")+f("decimals","decimals","number")+f("size","size","number","auto — fit box")+f("fallback","if error");
  else if(el.type==="text")h=f("value","value")+f("size","size","number","auto — fit box");
  else if(el.type==="icon"){
    h=f("icon","mdi name")+`<div class="row"><label></label><button id="browse">Browse icons…</button>
      <span class="mdiprev" id="mdiprev"></span></div>`+f("size","size","number","auto — fit box");
  }
  else if(el.type==="curve")h=f("entity","entity")+f("hours","hours","number")+
    `<div id="legib">A sparkline of that entity's recent history — the shape of
     today, not a number. Good for solar output or power draw.</div>`;
  else if(el.type==="line")h=f("thickness","thickness","number");
  if(el.type==="text"||el.type==="number")
    h+=`<div class="row"><label>align</label><select data-k="align">
        ${["left","center","right"].map(a=>`<option${el.align===a?" selected":""}>${a}</option>`).join("")}</select></div>`;
  h+=`<div class="row"><label>position</label>
        <input data-k="x" type="number" value="${el.x}" title="x">
        <input data-k="y" type="number" value="${el.y}" title="y"></div>
      <div class="row"><label>size</label>
        <input data-k="w" type="number" value="${el.w}" title="width">
        <input data-k="h" type="number" value="${el.h}" title="height"></div>`;
  const m=metrics.find(x=>x.i===sel);
  if(m) h+=`<div id="legib">Renders at <b>${m.size} px</b> = <b>${m.mm} mm</b> —
       <span class="${m.mm>=13?"ok":"warn"}">${m.verdict}</span>${m.overflow?' <span class="warn">· overflows its box</span>':""}</div>`;
  h+=`<div class="row" style="margin-top:8px"><button id="dup">Duplicate</button><button id="del">Remove</button></div>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-k]").forEach(inp=>inp.onchange=()=>{
    snapshot();
    const k=inp.dataset.k, v=inp.value;
    if(v===""){ delete el[k]; } else { el[k]=(inp.type==="number")?Number(v):v; }
    preview();
  });
  if($("browse")){
    const cp=(el.icon||"").toString();
    $("browse").onclick=()=>openPicker(el);
    fetch("api/mdi/list?q="+encodeURIComponent(cp.replace("mdi:","")))
      .then(r=>r.json()).then(l=>{const m=l.find(x=>"mdi:"+x.n===cp||x.n===cp);
        if(m&&$("mdiprev")) $("mdiprev").textContent=String.fromCodePoint(m.c);}).catch(()=>{});
  }
  $("dup").onclick=duplicate;
  $("del").onclick=()=>{snapshot();els().splice(sel,1);sel=-1;paint();preview();};
}

/* ---------- page level ---------- */
$("undo").onclick=undo; $("redo").onclick=redo;
$("page").onchange=e=>select(e.target.value);
function holdRow(){ $("holdrow").style.display = page()&&page().tier==="alert" ? "flex" : "none"; }
$("tier").onchange=e=>{snapshot();page().tier=e.target.value;holdRow();};
$("hold").onchange=e=>{snapshot();page().hold_minutes=Number(e.target.value)||10;};
$("showif").onchange=e=>{snapshot();const v=e.target.value.trim(); v?page().show_if=v:delete page().show_if;};
$("addpage").onclick=()=>{
  const n=prompt("Page name (lowercase, no spaces)"); if(!n) return;
  snapshot(); spec.pages[n]={tier:"rotate",elements:[]};
  if(!spec.rotation.includes(n)) spec.rotation.push(n);
  fillPages(); select(n);
};
$("delpage").onclick=()=>{
  if(!cur||!confirm(`Delete page "${cur}"?`)) return;
  snapshot(); delete spec.pages[cur];
  spec.rotation=spec.rotation.filter(n=>n!==cur);
  fillPages(); select(Object.keys(spec.pages)[0]);
};
$("save").onclick=async()=>{
  try{
    await api("api/layouts",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(spec)});
    msg("Saved — the panel picks it up on its next refresh.");
  }catch(e){ msg("save failed: "+e.message); }
};
/* ---------- icon picker ---------- */
let pickTarget=null;
function openPicker(el){ pickTarget=el; $("pickwrap").style.display="flex";
  $("picksearch").value=""; loadIcons(""); $("picksearch").focus(); }
$("pickclose").onclick=()=>$("pickwrap").style.display="none";
$("pickwrap").onclick=e=>{ if(e.target.id==="pickwrap") $("pickwrap").style.display="none"; };
$("picksearch").oninput=e=>loadIcons(e.target.value);
async function loadIcons(q){
  const list=await fetch("api/mdi/list?q="+encodeURIComponent(q)).then(r=>r.json()).catch(()=>[]);
  $("picks").innerHTML=list.map(i=>
    `<button data-n="${i.n}" title="mdi:${i.n}">${String.fromCodePoint(i.c)}<span>${i.n}</span></button>`).join("");
  $("picks").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    snapshot(); pickTarget.icon="mdi:"+b.dataset.n;
    $("pickwrap").style.display="none"; paint(); preview();
  });
}

$("push").onclick=async()=>{
  try{ await api("api/push",{method:"POST"}); msg("Pushed — the panel is fetching now."); }
  catch(e){ msg("push failed: "+e.message); }
};

boot().catch(e=>msg("load failed: "+e.message));
</script>
