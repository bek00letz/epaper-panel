# @DISPLAY_NAME@ (@SKU@, @W@x@H@) e-paper panel, generated by the E-paper panel add-on @VERSION@.
#
# Install it from the ESPHome Device Builder. To change it, use the add-on's
# Panel setup rather than editing here: the add-on rewrites this file and keeps
# the previous one next to it as <name>.yaml.previous.
#
# The panel downloads every page of the rotation in one frame file, keeps it in
# memory and shows one page at a time, so paging with the dial needs no
# network. Downloads run in the background; the buttons never wait on them.

substitutions:
  name: @DEVICE_NAME@
  frames_url: @FRAMES_URL@

esphome:
  name: ${name}
  friendly_name: E-paper panel
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &w = epf::PanelController::instance().waveform();
          w.set_threshold((int) id(ghost_clear_after).state);
          auto mode = id(ghost_mode).active_index();
          w.set_classic(mode.has_value() && mode.value() == 1);
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Pinned to the add-on's release, so the panel and the add-on always speak the
# same version of the frame format.
external_components:
  - source: github://bek00letz/epaper-panel@@COMPONENT_REF@
    components: [epf]
@DISPLAY_COMPONENT@
epf:

font:
  - file: "gfonts://Lato@700"
    id: diag_big
    size: 56
  - file: "gfonts://Lato@400"
    id: diag_small
    size: 26

logger:

api:
  encryption:
    key: @API_KEY@
  actions:
    - action: refresh_now
      then:
        - script.execute: request_refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::GOTO_PAGE, index);'
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
        sub: int
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::GOTO_CAT_SUB, category, sub);'
        - script.execute: redraw
    # Relative paging, for remotes and Home Assistant automations.
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().step(delta);'
        - script.execute: redraw
    - action: mode_toggle
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::MODE_TOGGLE);'
        - script.execute: redraw
    - action: category_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::CAT_STEP, delta);'
        - script.execute: redraw
    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::SUB_STEP, delta);'
        - script.execute: redraw
    - action: hold_toggle
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_PAGE_TOGGLE);'
        - script.execute: redraw
    - action: category_pin_toggle
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_CAT_TOGGLE);'
        - script.execute: redraw
    - action: lock_toggle
      then:
        - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::LOCK_TOGGLE);'
        - script.execute: redraw

ota:
  - platform: esphome
    password: @OTA_PASSWORD@

wifi:
  ssid: @WIFI_SSID@
  password: @WIFI_PASSWORD@
  fast_connect: true

# GPIO7 powers the display; nothing renders until it is high.
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

@DISPLAY_BLOCK@
    lambda: |-
      auto &panel = epf::PanelController::instance();
      auto &client = epf::EpfClient::instance();
      if (client.blit(id(epd), panel.page())) {
        client.draw_overlays(id(epd), panel.overlay_state());
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.print(40, 170, id(diag_small), "waiting for frames");
      }

# The five controls are discrete push-buttons (Elecrow's 5.79_key demo), all
# active-low. Which is "next" depends on how the panel is mounted.
binary_sensor:
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: @NEXT_PIN@, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::NEXT);'
      - script.execute: redraw

  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: @PREV_PIN@, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PREV);'
      - script.execute: redraw

  # Dial centre: hold 1 s to switch between categories and their items. A short
  # press does nothing, so tilting the dial while scrolling can't switch modes.
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 30ms, delayed_off: 30ms]
    on_click:
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::MODE_TOGGLE);'
          - script.execute: redraw

  # Top button: click locks the category, hold locks the page.
  - platform: gpio
    id: key_top
    internal: true
    pin: {number: @TOP_PIN@, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_CAT_TOGGLE);'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_PAGE_TOGGLE);'
          - script.execute: redraw

  # Bottom button: click goes to the first page, hold downloads new frames now.
  - platform: gpio
    id: key_bottom
    internal: true
    pin: {number: @BOTTOM_PIN@, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::RESET_HOME);'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - script.execute: refetch

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: @INTERVAL_MIN@
    restore_value: true
    unit_of_measurement: "min"
    mode: box

  # Ghost clearing (see WaveformPolicy in epf_core.h). Settings, not
  # controls: they live in the device's configuration section in Home
  # Assistant and survive reboots.
  - platform: template
    name: "Ghost clear after"
    id: ghost_clear_after
    entity_category: config
    icon: "mdi:ghost-outline"
    optimistic: true
    min_value: 2
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    unit_of_measurement: "refreshes"
    mode: box
    on_value:
      - lambda: 'epf::PanelController::instance().waveform().set_threshold((int) x);'

select:
  - platform: template
    name: "Ghost clearing"
    id: ghost_mode
    entity_category: config
    icon: "mdi:ghost-outline"
    optimistic: true
    restore_value: true
    options:
      - "On automatic changes"
      - "Every Nth refresh"
    initial_option: "On automatic changes"
    on_value:
      - lambda: 'epf::PanelController::instance().waveform().set_classic(i == 1);'

button:
  - platform: template
    name: "Clear ghosting"
    icon: "mdi:ghost-off-outline"
    on_press:
      - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::CLEAR_GHOSTING);'
      - script.execute: redraw

script:
  - id: redraw
    mode: restart
    then:
      - delay: 80ms
      - lambda: |-
          if (epf::PanelController::instance().begin_redraw()) id(epd).force_full_update();
      - component.update: epd

  # Home Assistant asked for new frames. While someone is scrolling, wait
  # until they stop so the pages don't change under them.
  - id: request_refetch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto &panel = epf::PanelController::instance();
              if (!panel.should_defer_refetch()) return true;
              panel.set_pending_refetch(true);
              ESP_LOGI("panel", "Scrolling: downloading new frames once it stops");
              return false;
          then:
            - script.execute: refetch

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.set_pending_refetch(false);
          panel.reset_fetch_idle();
          if (!epf::EpfClient::instance().start_fetch("${frames_url}", id(epd)))
            ESP_LOGD("panel", "A download is already running");

interval:
  # Pick up a finished download. Cheap when there is none.
  - interval: 200ms
    then:
      - lambda: |-
          epf::FetchResult result;
          auto &client = epf::EpfClient::instance();
          if (!client.poll(result)) return;
          auto &panel = epf::PanelController::instance();
          if (result == epf::FetchResult::OK) {
            panel.on_stream_loaded(client.stream());
            id(redraw).execute();
          } else if (result != epf::FetchResult::NOT_MODIFIED) {
            int every = std::max(30, (int) (id(panel_refresh_interval).state * 60.0f));
            panel.retry_fetch_in(30, every);
          }

  - interval: 5s
    then:
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.tick_seconds(5);
          if (panel.pending_refetch() && !panel.should_defer_refetch()) {
            ESP_LOGI("panel", "Scrolling stopped: downloading the deferred frames");
            id(refetch).execute();
          }
          if (panel.check_auto_rotate()) id(redraw).execute();
          else if (panel.idle_clear_due()) id(redraw).execute();
          // The panel's own timer. During quiet hours it stays asleep until
          // the add-on wakes it (the add-on retries until that's delivered).
          if (!panel.quiet_hours_active()) {
            int every = std::max(30, (int) (id(panel_refresh_interval).state * 60.0f));
            if (panel.fetch_idle_sec() >= every) {
              panel.reset_fetch_idle();
              id(request_refetch).execute();
            }
          }
