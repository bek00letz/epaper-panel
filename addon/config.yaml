name: E-paper panel
version: "0.8.30"
slug: epaper_panel
description: 'Render Home Assistant onto Elecrow CrowPanel E-Paper displays (primary: 5.79" DIS08792E; also 4.2", 2.9", 7.5", 10.2"), with an intuitive visual editor'
url: https://github.com/bek00letz/epaper-panel
arch:
  - amd64
  - aarch64
init: false

# The editor runs behind Home Assistant's own login, in the sidebar.
ingress: true
ingress_port: 8080
panel_icon: mdi:tablet-dashboard
panel_title: E-paper

# A second port so the panel can fetch frames over the LAN without ingress.
# Optionally protected by `frame_token` (?token=...).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Frame fetches from the panel (LAN)

# Supervisor injects a token for the API and websocket -- nothing to create.
homeassistant_api: true

# Everything else -- pages, data sources -- is configured in the editor,
# which is a better form than this one and keeps the add-on options empty
# for anyone who just wants their existing HA entities on a panel.
options:
  refresh_seconds: 60
  esphome_device: "crowpanel_epaper"
schema:
  refresh_seconds: "int(10,3600)"
  esphome_device: "str?"
  frame_token: "password?"
  # DEPRECATED, kept only so an existing install migrates its Jellyfin
  # settings into the editor's Data sources on first start. Safe to clear
  # afterwards; a later version drops them.
  jellyfin_base: "str?"
  jellyfin_user: "str?"
  jellyfin_key: "password?"
