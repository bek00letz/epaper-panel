# CrowPanel 5.79" (DIS08792E, 792x272) e-paper panel, generated by the E-paper panel add-on 0.12.0.
#
# Install it from the ESPHome Device Builder. To change it, use the add-on's
# Panel setup rather than editing here: the add-on rewrites this file and keeps
# the previous one next to it as <name>.yaml.previous.
#
# The panel downloads every page of the rotation in one frame file, keeps it in
# memory and shows one page at a time, so paging with the dial needs no
# network. Downloads run in the background; the buttons never wait on them.
#
# Low Power Mode is the add-on's to switch, per screen, with no new install:
# when it's on, each answer says how long to sleep, and the panel deep-sleeps
# until then or until a button is pressed. Off, it stays connected.

substitutions:
  name: crowpanel-epaper
  frames_url: "http://homeassistant.local:8099/frames.epf"

esphome:
  name: ${name}
  friendly_name: "E-paper panel"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          epf::power_begin(7);  // why it's awake, for the first download
          // Slept with the display powered: it still shows its picture, so no full refresh first.
          if (epf::PowerPolicy::instance().picture_kept()) epf::crowpanel_picture_kept(id(epd));
          auto &w = epf::PanelController::instance().waveform();
          w.set_threshold((int) id(ghost_clear_after).state);
          auto mode = id(ghost_mode).active_index();
          w.set_classic(mode.has_value() && mode.value() == 1);
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Pinned to the add-on's release, so the panel and the add-on always speak the
# same version of the frame format.
external_components:
  - source: github://bek00letz/epaper-panel@v0.12.0
    components: [epf]
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2@319ad7c6ffc5e15092c7fbff2ce2b7f4500efc05

epf:

globals:
  - id: last_dial_ms
    type: uint32_t
    initial_value: '0'
  # When the display was last asked to redraw (Low Power Mode waits for it).
  # 0: not since it woke.
  - id: last_redraw_ms
    type: uint32_t
    initial_value: '0'

font:
  - file: "gfonts://Lato@700"
    id: diag_big
    size: 56
  - file: "gfonts://Lato@400"
    id: diag_small
    size: 26

logger:

# A wake never waits for Home Assistant, and Home Assistant being away never
# restarts a panel that doesn't need it (the default would, after 15 minutes).
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: refresh_now
      then:
        - script.execute: request_refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::GOTO_PAGE, index);'
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
        sub: int
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::GOTO_CAT_SUB, category, sub);'
        - script.execute: redraw
    # Relative paging, for remotes and Home Assistant automations.
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().step(delta);'
        - script.execute: redraw
    - action: mode_toggle
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::MODE_TOGGLE);'
        - script.execute: redraw
    - action: category_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::CAT_STEP, delta);'
        - script.execute: redraw
    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::SUB_STEP, delta);'
        - script.execute: redraw
    - action: hold_toggle
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::PIN_PAGE_TOGGLE);'
        - script.execute: redraw
    - action: category_pin_toggle
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::PIN_CAT_TOGGLE);'
        - script.execute: redraw
    - action: lock_toggle
      then:
        - lambda: 'epf::PanelController::instance().remote(epf::NavAction::LOCK_TOGGLE);'
        - script.execute: redraw

# Updates are encrypted with the same key as the Home Assistant connection
# (an empty encryption block reuses it). No separate password: ESPHome
# recommends this, and drops the password-only route in 2027.3.
ota:
  - platform: esphome
    encryption: {}
    # Never asleep in the middle of an update.
    on_begin:
      - lambda: 'epf::PowerPolicy::instance().hold(true);'
    on_error:
      - lambda: 'epf::PowerPolicy::instance().hold(false);'

# Always here, never on its own: only an answer from the add-on puts the panel
# to sleep (script go_to_sleep), for as long as the answer says.
deep_sleep:
  id: deep_sleep_ctl

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

# GPIO7 powers the display; nothing renders until it is high. In Low
# Power Mode it stays on through deep sleep (epf::power_prepare_sleep).
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

  # Asleep: the sleep screen, no rotation, no timed downloads. Also set by
  # holding the dial centre, and by quiet hours.
  - platform: template
    name: "Sleep"
    id: sleep_switch
    icon: "mdi:sleep"
    lambda: 'return epf::PanelController::instance().sleeping();'
    turn_on_action:
      - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::SLEEP);'
      - script.execute: redraw
    turn_off_action:
      - lambda: 'epf::PanelController::instance().remote(epf::NavAction::WAKE);'
      - script.execute: redraw

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    # Full refreshes are decided by the panel's ghost-clearing policy
    # (WaveformPolicy), not by a fixed count.
    full_update_every: 1000000
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      auto &panel = epf::PanelController::instance();
      auto &client = epf::EpfClient::instance();
      if (client.blit(id(epd), panel.page())) {
        client.draw_overlays(id(epd), panel.overlay_state());
      #ifdef USE_WIFI_AP
      // Only with its own Wi-Fi turned on (Panel setup); without it, there's no get_ap().
      } else if (wifi::global_wifi_component->is_ap_active()) {
        // No Wi-Fi it knows: say how to give it one.
        it.print(40, 40, id(diag_big), "Not connected");
        it.printf(40, 130, id(diag_small), "On your phone, join the Wi-Fi \"%s\"",
                  wifi::global_wifi_component->get_ap().get_ssid().c_str());
        it.print(40, 170, id(diag_small), "and choose a network for this panel.");
      #endif
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.print(40, 170, id(diag_small), "waiting for frames");
      }

# The five controls are discrete push-buttons (Elecrow's 5.79_key demo), all
# active-low. Which is "next" depends on how the panel is mounted.
binary_sensor:
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: |-
          id(last_dial_ms) = millis();
          epf::PowerPolicy::instance().note_press(millis());
          epf::PanelController::instance().dispatch(epf::NavAction::NEXT);
      - script.execute: redraw

  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: |-
          id(last_dial_ms) = millis();
          epf::PowerPolicy::instance().note_press(millis());
          epf::PanelController::instance().dispatch(epf::NavAction::PREV);
      - script.execute: redraw

  # Dial centre: a press switches between categories and their items; holding
  # it for a second puts the panel to sleep (or wakes it). The dial tilts as
  # it turns and can press the centre by accident, so a click within 0.4 s of
  # a turn is ignored.
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 30ms, delayed_off: 30ms]
    on_press:
      - lambda: 'epf::PowerPolicy::instance().note_press(millis());'
    on_click:
      - min_length: 30ms
        max_length: 700ms
        then:
          - if:
              condition:
                lambda: 'return millis() - id(last_dial_ms) > 400;'
              then:
                - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::MODE_TOGGLE);'
                - script.execute: redraw
              else:
                - logger.log: "Ignored a centre click right after turning the dial"
      - min_length: 1000ms
        max_length: 6000ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::SLEEP_TOGGLE);'
          - script.execute: redraw

  # Top button: click locks the category, hold locks the page.
  - platform: gpio
    id: key_top
    internal: true
    pin: {number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PowerPolicy::instance().note_press(millis());'
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_CAT_TOGGLE);'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::PIN_PAGE_TOGGLE);'
          - script.execute: redraw

  # Bottom button: click goes to the first page. Hold downloads new frames now
  # and clears ghosting with the same redraw: one flash, not two.
  - platform: gpio
    id: key_bottom
    internal: true
    pin: {number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PowerPolicy::instance().note_press(millis());'
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::RESET_HOME);'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::CLEAR_GHOSTING);'
          - script.execute: refetch

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "min"
    mode: box

  # Ghost clearing (see WaveformPolicy in epf_core.h). Settings, not
  # controls: they live in the device's configuration section in Home
  # Assistant and survive reboots.
  - platform: template
    name: "Ghost clear after"
    id: ghost_clear_after
    entity_category: config
    icon: "mdi:ghost-outline"
    optimistic: true
    min_value: 2
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    unit_of_measurement: "refreshes"
    mode: box
    on_value:
      - lambda: 'epf::PanelController::instance().waveform().set_threshold((int) x);'

select:
  - platform: template
    name: "Ghost clearing"
    id: ghost_mode
    entity_category: config
    icon: "mdi:ghost-outline"
    optimistic: true
    restore_value: true
    options:
      - "On automatic changes"
      - "Every Nth refresh"
    initial_option: "On automatic changes"
    on_value:
      - lambda: 'epf::PanelController::instance().waveform().set_classic(i == 1);'

button:
  - platform: template
    name: "Clear ghosting"
    icon: "mdi:ghost-off-outline"
    on_press:
      - lambda: 'epf::PanelController::instance().dispatch(epf::NavAction::CLEAR_GHOSTING);'
      - script.execute: redraw

script:
  - id: redraw
    mode: restart
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: |-
              if (epf::may_redraw()) return true;
              #ifdef USE_WIFI_AP
              if (wifi::global_wifi_component->is_ap_active()) return true;   // say how to give it a network
              #endif
              ESP_LOGD("panel", "Just woke: keeping the picture until the frames arrive");
              return false;
          then:
            - lambda: |-
                if (epf::PanelController::instance().begin_redraw()) id(epd).force_full_update();
                id(last_redraw_ms) = millis();
            - component.update: epd

  # Home Assistant asked for new frames. While someone is scrolling, wait
  # until they stop so the pages don't change under them.
  - id: request_refetch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto &panel = epf::PanelController::instance();
              if (!panel.should_defer_refetch()) return true;
              panel.set_pending_refetch(true);
              ESP_LOGI("panel", "Scrolling: downloading new frames once it stops");
              return false;
          then:
            - script.execute: refetch

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.set_pending_refetch(false);
          panel.reset_fetch_idle();
          auto &client = epf::EpfClient::instance();
          if (!client.start_fetch("${frames_url}", id(epd)) && client.busy()) {
            // Asked while a download runs: that one may carry the old pages.
            // Download again once it's done.
            panel.set_pending_refetch(true);
            ESP_LOGD("panel", "A download is running; another follows it");
          }

  # Low Power Mode: everything on screen is done, so sleep until the next
  # check or a press of any of the five buttons (GPIO 1, 2, 4, 5, 6, all
  # RTC-capable on the ESP32-S3; active-low, so any one pressed wakes it).
  # The display sleeps too, powered, keeping its picture for the next wake.
  - id: go_to_sleep
    mode: single
    then:
      - deep_sleep.enter:
          id: deep_sleep_ctl
          sleep_duration: !lambda |-
            return epf::power_prepare_sleep(millis(), (1ULL << 1) | (1ULL << 2) | (1ULL << 4) | (1ULL << 5) | (1ULL << 6));

interval:
  # Pick up a finished download. Cheap when there is none.
  - interval: 200ms
    then:
      - lambda: |-
          epf::FetchResult result;
          auto &client = epf::EpfClient::instance();
          auto &panel = epf::PanelController::instance();
          if (client.poll(result)) {
            epf::power_note_download(millis(), result);   // whether the answer says to sleep
            if (result == epf::FetchResult::OK) {
              panel.note_fetch(true);
              panel.on_stream_loaded(client.stream());
              id(redraw).execute();
            } else if (result == epf::FetchResult::NOT_MODIFIED && !client.has_stream()) {
              // After a deep sleep: the page on screen hasn't changed, but the frames
              // aren't in memory. Fine to sleep on; anything more needs them again.
              panel.note_fetch(true);
              client.forget_etag();
              if (!epf::PowerPolicy::instance().sleep_due(millis(), false)) id(refetch).execute();
            } else {
              // Failed: owed, and retried with a backoff even while resting.
              panel.note_fetch(result == epf::FetchResult::NOT_MODIFIED);
              // Nothing new, but a redraw is still owed (e.g. the clear on a
              // long press of the bottom button).
              if (panel.pending_redraw()) id(redraw).execute();
            }
          }
          if (panel.take_wake_fetch()) id(refetch).execute();   // just woke: get fresh frames
          // Low Power Mode: sleep once the download and the picture are done.
          bool busy = client.busy() || id(refetch).is_running() || id(redraw).is_running() || !(id(epd).is_idle());
          if (epf::PowerPolicy::instance().sleep_due(millis(), busy) && !id(go_to_sleep).is_running())
            id(go_to_sleep).execute();

  - interval: 5s
    then:
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.tick_seconds(5);
          if (panel.pending_refetch() && !panel.should_defer_refetch() && !epf::EpfClient::instance().busy()) {
            ESP_LOGI("panel", "Scrolling stopped: downloading the deferred frames");
            id(refetch).execute();
          }
          if (panel.check_auto_rotate()) id(redraw).execute();
          else if (panel.idle_clear_due()) id(redraw).execute();
          // The panel's own timer. Asleep or in quiet hours, it waits for
          // the add-on or a press instead (the add-on retries until
          // delivered), except to retry a download that failed. Off in Low
          // Power Mode: the add-on's answer says when it next checks.
          int every = std::max(30, (int) (id(panel_refresh_interval).state * 60.0f));
          if (epf::own_timer_fetch_due(panel, epf::PowerPolicy::instance(), every)) {
            panel.reset_fetch_idle();
            id(request_refetch).execute();
          }
