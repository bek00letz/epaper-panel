# CrowPanel 5.79" e-paper living-room panel.
#
# Home Assistant renders every page of the rotation into one tall PNG; the
# panel holds it in PSRAM and blits a slice. Paging with the dial therefore
# needs no network at all -- just a partial refresh, about half a second.
#
# STAGE 2 (this file): still mains-powered, no deep sleep, so it stays
# reachable over OTA. See the bottom for turning it into a battery device.

substitutions:
  name: crowpanel-epaper
  frames_url: "http://homeassistant.local:8099/frames.png"
  frame_url:  "http://homeassistant.local:8099/frame.png"
  page_h: "272"

esphome:
  name: ${name}
  friendly_name: E-paper panel
  on_boot:
    priority: -100
    then:
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2

globals:
  - id: have_frames
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: have_single
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: page
    type: int
    restore_value: false
    initial_value: '0'
  - id: page_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: sub_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: cat_pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: cat_offsets
    type: std::vector<int>
    restore_value: false
  - id: cat_sizes
    type: std::vector<int>
    restore_value: false
  - id: sub_mode
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: idle_sec
    type: int
    initial_value: '0'
    restore_value: false
  - id: last_ok_press_ms
    type: uint32_t
    initial_value: '0'
    restore_value: false

font:
  - file: "../addon/app/fonts/Lato-Bold.ttf"
    id: diag_big
    size: 56
  - file: "../addon/app/fonts/Lato-Regular.ttf"
    id: diag_small
    size: 26

logger:

# Lets Home Assistant push the panel instead of it only ever pulling on a
# timer -- so "Re-render now" on the dashboard updates the screen at once.
api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: refresh_now
      then:
        - script.execute: refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: |-
            if (index >= 0 && index < id(page_count)) id(page) = index;
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
        sub: int
      then:
        - lambda: |-
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            if (category >= 0 && category < cats) {
              id(cat_idx) = category;
              int sz = (category < id(cat_sizes).size()) ? id(cat_sizes)[category] : 1;
              id(sub_idx) = (sub >= 0 && sub < sz) ? sub : 0;
              int off = (category < id(cat_offsets).size()) ? id(cat_offsets)[category] : category;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    # Relative paging, for remotes.
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: |-
            int n = id(page_count) > 0 ? id(page_count) : 1;
            id(page) = ((id(page) + delta) % n + n) % n;
        - script.execute: redraw

    - action: category_step
      variables:
        delta: int
      then:
        - lambda: |-
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            id(cat_idx) = ((id(cat_idx) + delta) % cats + cats) % cats;
            id(sub_idx) = 0;
            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
            if (off < id(page_count)) id(page) = off;
        - script.execute: redraw

    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: |-
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = ((id(sub_idx) + delta) % sz + sz) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    - action: hold_toggle
      then:
        - lambda: 'id(pinned) = !id(pinned);'
        - script.execute: redraw

    - action: category_pin_toggle
      then:
        - lambda: 'id(cat_pinned) = !id(cat_pinned);'
        - script.execute: redraw

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 10
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      if (id(have_frames)) {
        const int off = ${page_h} * id(page);
        bool is_sub_mode = id(sub_mode);
        const int cat_x0 = 80, cat_x1 = 300;
        const int sub_x0 = 715, sub_x1 = 772;
        const int py0 = 244, py1 = 268;

        int c_idx = id(cat_idx);
        int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
        if (sz <= 1) {
          is_sub_mode = false;
        }

        auto in_rounded_box = [](int px, int py, int x0, int y0, int x1, int y1, int r) -> bool {
          if (px < x0 || px > x1 || py < y0 || py > y1) return false;
          if (px < x0 + r && py < y0 + r) {
            int dx = (x0 + r) - px, dy = (y0 + r) - py;
            return (dx * dx + dy * dy <= r * r);
          }
          if (px > x1 - r && py < y0 + r) {
            int dx = px - (x1 - r), dy = (y0 + r) - py;
            return (dx * dx + dy * dy <= r * r);
          }
          if (px < x0 + r && py > y1 - r) {
            int dx = (x0 + r) - px, dy = py - (y1 - r);
            return (dx * dx + dy * dy <= r * r);
          }
          if (px > x1 - r && py > y1 - r) {
            int dx = px - (x1 - r), dy = py - (y1 - r);
            return (dx * dx + dy * dy <= r * r);
          }
          return true;
        };

        for (int y = 0; y < ${page_h}; y++) {
          for (int x = 0; x < 792; x++) {
            int vx = 791 - x;
            int vy = 271 - y;

            bool in_cat = in_rounded_box(vx, vy, cat_x0, py0, cat_x1, py1, 4);
            bool in_sub = (sz > 1) && in_rounded_box(vx, vy, sub_x0, py0, sub_x1, py1, 4);
            bool inv = (!is_sub_mode && in_cat) || (is_sub_mode && in_sub);

            Color c = id(frames).get_pixel(x, y + off);
            if (inv) {
              c = (c == COLOR_ON) ? COLOR_OFF : COLOR_ON;
            }
            it.draw_pixel_at(x, y, c);
          }
        }

        // Draw an Apple-polished solid black badge with a bold, crisp white padlock inside
        auto draw_lock_badge = [&](int bx, int by, int bw, int bh) {
          int cx = bx + bw / 2;
          int cy = by + bh / 2;
          for (int py = by; py < by + bh; py++) {
            for (int px = bx; px < bx + bw; px++) {
              if (in_rounded_box(px, py, bx, by, bx + bw - 1, by + bh - 1, 4)) {
                int dx = px - cx;
                int dy = py - cy;
                bool is_shackle = false;
                if (dy >= -7 && dy <= -2) {
                  if (dy <= -5) {
                    is_shackle = (dx >= -4 && dx <= 3);
                  } else {
                    is_shackle = (dx >= -5 && dx <= -3) || (dx >= 2 && dx <= 4);
                  }
                }
                bool is_body = (dy >= -1 && dy <= 7 && dx >= -7 && dx <= 6);
                bool is_keyhole = false;
                if ((dy >= 1 && dy <= 3 && dx >= -1 && dx <= 0) || (dy >= 4 && dy <= 5 && dx == 0)) {
                  is_keyhole = true;
                }

                Color col = COLOR_ON;
                if ((is_shackle || is_body) && !is_keyhole) {
                  col = COLOR_OFF;
                }

                int rx = 791 - px;
                int ry = 271 - py;
                if (rx >= 0 && rx < 792 && ry >= 0 && ry < 272) {
                  it.draw_pixel_at(rx, ry, col);
                }
              }
            }
          }
        };

        if (id(cat_pinned)) {
          // Category Lock: prominent badge immediately following the category pill
          draw_lock_badge(308, py0, 28, 24);
        }

        if (id(pinned)) {
          // Panel Lock: prominent badge positioned by the sub-item indicator or corner
          int lx = (sz > 1) ? 680 : 744;
          draw_lock_badge(lx, py0, 28, 24);
        }
      } else if (id(have_single)) {
        // Strip missing -- fall back to whatever single frame HA is serving.
        it.image(0, 0, id(frame));
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.printf(40, 170, id(diag_small), "waiting for %s", "frames.png");
      }

http_request:
  verify_ssl: false
  timeout: 15s
  buffer_size_rx: 8192

online_image:
  - id: frames
    url: ${frames_url}
    format: png
    type: BINARY
    buffer_size: 32768
    on_download_finished:
      - lambda: |-
          int h = id(frames).get_height();
          id(page_count) = (h >= ${page_h}) ? h / ${page_h} : 1;
          if (id(page) >= id(page_count)) id(page) = 0;
          id(have_frames) = true;

          // Check if self-describing metadata row is present (height == page_count * page_h + 1)
          if (h >= id(page_count) * ${page_h} + 1) {
            int meta_y = id(page_count) * ${page_h};
            auto read_byte = [&](int byte_idx) -> int {
              int val = 0;
              int start_px = byte_idx * 8;
              for (int b = 0; b < 8; b++) {
                if (start_px + b < 792 && id(frames).get_pixel(start_px + b, meta_y) == COLOR_ON) {
                  val |= (1 << (7 - b));
                }
              }
              return val;
            };

            int magic = read_byte(0);
            if (magic == 0xA5) {
              int num_cats = read_byte(2);
              if (num_cats > 0 && num_cats <= 30) {
                id(cat_offsets).clear();
                id(cat_sizes).clear();
                id(cat_count) = num_cats;
                for (int i = 0; i < num_cats; i++) {
                  int off = read_byte(3 + i * 2);
                  int sz = read_byte(3 + i * 2 + 1);
                  id(cat_offsets).push_back(off);
                  id(cat_sizes).push_back(sz);
                }
                ESP_LOGI("panel", "Loaded metadata directly from frames.png: %d categories", num_cats);
              }
            }
          }

          if (id(cat_offsets).empty() || id(cat_count) <= 0) {
            id(cat_offsets).clear();
            id(cat_sizes).clear();
            id(cat_count) = id(page_count);
            for (int i = 0; i < id(page_count); i++) {
              id(cat_offsets).push_back(i);
              id(cat_sizes).push_back(1);
            }
          }
          if (id(cat_idx) >= id(cat_count)) id(cat_idx) = 0;
          ESP_LOGI("panel", "%d pages (%d categories) held locally", id(page_count), id(cat_count));
      - if:
          condition:
            lambda: 'return (id(idle_sec) > 30);'
          then:
            - component.update: epd
    on_error:
      - logger.log: "frames.png missing - falling back to single frame"
      - component.update: frame

  - id: frame
    url: ${frame_url}
    format: png
    type: BINARY
    buffer_size: 32768
    on_download_finished:
      - lambda: 'id(have_single) = true;'
      - component.update: epd
    on_error:
      - logger.log: "frame.png failed too - retrying in 20s"
      - component.update: epd
      - delay: 20s
      - script.execute: refetch

binary_sensor:
  # Five discrete push-buttons:
  # Dial Rotate Right (GPIO 6 in 180° mount): Forward
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - logger.log: "KEY next (dial forward)"
      - lambda: |-
          id(idle_sec) = 0;
          if (millis() - id(last_ok_press_ms) < 200) {
            ESP_LOGD("panel", "Ignoring rocker tilt crosstalk from center press");
            return;
          }
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          if (id(cat_idx) >= cats) id(cat_idx) = 0;

          if (id(sub_mode)) {
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = (id(sub_idx) + 1) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            } else {
              id(sub_mode) = false;
              id(cat_idx) = (id(cat_idx) + 1) % cats;
              id(sub_idx) = 0;
              int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
              if (off < id(page_count)) id(page) = off;
            }
          } else {
            id(cat_idx) = (id(cat_idx) + 1) % cats;
            id(sub_idx) = 0;
            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
            if (off < id(page_count)) id(page) = off;
          }
      - script.execute: redraw

  # Dial Rotate Left (GPIO 4 in 180° mount): Backward
  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - logger.log: "KEY prev (dial backward)"
      - lambda: |-
          id(idle_sec) = 0;
          if (millis() - id(last_ok_press_ms) < 200) {
            ESP_LOGD("panel", "Ignoring rocker tilt crosstalk from center press");
            return;
          }
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          if (id(cat_idx) >= cats) id(cat_idx) = 0;

          if (id(sub_mode)) {
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = (id(sub_idx) - 1 + sz) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            } else {
              id(sub_mode) = false;
              id(cat_idx) = (id(cat_idx) - 1 + cats) % cats;
              id(sub_idx) = 0;
              int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
              if (off < id(page_count)) id(page) = off;
            }
          } else {
            id(cat_idx) = (id(cat_idx) - 1 + cats) % cats;
            id(sub_idx) = 0;
            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
            if (off < id(page_count)) id(page) = off;
          }
      - script.execute: redraw

  # Dial Center Push (GPIO 5): Press = Toggle Category vs Sub-item Mode
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 30ms, delayed_off: 30ms]
    on_press:
      - logger.log: "KEY ok: press (toggle category vs sub-item mode)"
      - lambda: |-
          id(idle_sec) = 0;
          id(last_ok_press_ms) = millis();
          int c_idx = id(cat_idx);
          int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
          if (sz > 1) {
            id(sub_mode) = !id(sub_mode);
            ESP_LOGI("panel", "Navigation mode toggled: sub_mode=%d (sz=%d)", id(sub_mode), sz);
          } else {
            id(sub_mode) = false;
            ESP_LOGI("panel", "Category has single page (sz=%d), staying in category mode", sz);
          }
      - script.execute: redraw

  # Physical Top Button (GPIO 1 in 180° mount): Short Click (<750ms) = Toggle Category Lock; Long Hold (>=750ms) = Toggle Panel Lock
  - platform: gpio
    id: key_top
    internal: true
    pin: {number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - logger.log: "KEY top: short click (toggle category lock)"
          - lambda: |-
              id(idle_sec) = 0;
              id(cat_pinned) = !id(cat_pinned);
              if (id(cat_pinned)) id(pinned) = false;
              ESP_LOGI("panel", "Category lock: %d", id(cat_pinned));
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - logger.log: "KEY top: long hold (toggle panel lock)"
          - lambda: |-
              id(idle_sec) = 0;
              id(pinned) = !id(pinned);
              if (id(pinned)) id(cat_pinned) = false;
              ESP_LOGI("panel", "Panel lock: %d", id(pinned));
          - script.execute: redraw

  # Physical Bottom Button (GPIO 2 in 180° mount): Short Click (<750ms) = First Page; Long Hold (>=750ms) = Force Refetch Now
  - platform: gpio
    id: key_bottom
    internal: true
    pin: {number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - logger.log: "KEY bottom: short click (reset to first page)"
          - lambda: |-
              id(idle_sec) = 0;
              id(cat_idx) = 0;
              id(sub_idx) = 0;
              id(page) = 0;
              id(sub_mode) = false;
              ESP_LOGI("panel", "Reset to page 0");
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - logger.log: "KEY bottom: long hold (force refetch)"
          - lambda: 'id(idle_sec) = 0;'
          - script.execute: refetch

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

  - platform: homeassistant
    id: ha_cat_count
    entity_id: sensor.epaper_category_count
    on_value:
      then:
        - lambda: |-
            int n = (int)x;
            if (n > 0) {
              id(cat_count) = n;
              if (id(cat_idx) >= n) id(cat_idx) = 0;
            }

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

  - platform: homeassistant
    id: ha_cat_offsets
    entity_id: sensor.epaper_category_offsets
    on_value:
      then:
        - lambda: |-
            if (id(cat_offsets).empty()) {
              const char *p = x.c_str();
              while (*p) {
                while (*p == ' ' || *p == ',') p++;
                if (!*p) break;
                char *end;
                long val = strtol(p, &end, 10);
                if (p == end) break;
                id(cat_offsets).push_back((int)val);
                p = end;
              }
              if (id(cat_offsets).empty()) id(cat_offsets).push_back(0);
            }

  - platform: homeassistant
    id: ha_cat_sizes
    entity_id: sensor.epaper_category_sizes
    on_value:
      then:
        - lambda: |-
            if (id(cat_sizes).empty()) {
              const char *p = x.c_str();
              while (*p) {
                while (*p == ' ' || *p == ',') p++;
                if (!*p) break;
                char *end;
                long val = strtol(p, &end, 10);
                if (p == end) break;
                id(cat_sizes).push_back((int)val);
                p = end;
              }
              if (id(cat_sizes).empty()) id(cat_sizes).push_back(1);
            }

script:
  - id: redraw
    mode: restart
    then:
      - delay: 80ms
      - component.update: epd

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - component.update: frames

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "min"
    mode: box

interval:
  - interval: 10s
    then:
      - lambda: |-
          id(idle_sec) += 10;
      - if:
          condition:
            lambda: |-
              int target_sec = (int)(id(panel_refresh_interval).state * 60.0);
              if (target_sec < 10) target_sec = 10;
              return (id(idle_sec) >= target_sec);
          then:
            - lambda: |-
                id(idle_sec) = 0;
            - if:
                condition:
                  lambda: 'return !id(pinned);'
                then:
                  - if:
                      condition:
                        lambda: 'return id(cat_pinned);'
                      then:
                        - lambda: |-
                            int c_idx = id(cat_idx);
                            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
                            if (sz > 1) {
                              id(sub_idx) = (id(sub_idx) + 1) % sz;
                              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                              int p = off + id(sub_idx);
                              if (p < id(page_count)) id(page) = p;
                            }
                        - script.execute: redraw
                      else:
                        - lambda: |-
                            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
                            id(cat_idx) = (id(cat_idx) + 1) % cats;
                            id(sub_idx) = 0;
                            id(sub_mode) = false;
                            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
                            if (off < id(page_count)) id(page) = off;
                        - script.execute: redraw
            - script.execute: refetch

