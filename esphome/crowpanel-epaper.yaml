# CrowPanel 5.79" e-paper living-room panel.
#
# Home Assistant renders every page of the rotation into one tall PNG; the
# panel holds it in PSRAM and blits a slice. Paging with the dial therefore
# needs no network at all -- just a partial refresh, about half a second.
#
# STAGE 2 (this file): still mains-powered, no deep sleep, so it stays
# reachable over OTA. See the bottom for turning it into a battery device.

substitutions:
  name: crowpanel-epaper
  frames_url: "http://homeassistant.local:8099/frames.png"
  frame_url:  "http://homeassistant.local:8099/frame.png"
  page_h: "272"

esphome:
  name: ${name}
  friendly_name: E-paper panel
  on_boot:
    priority: -100
    then:
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2

globals:
  - id: have_frames
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: have_single
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: page
    type: int
    restore_value: false
    initial_value: '0'
  - id: page_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: sub_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: cat_pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: cat_offsets
    type: std::vector<int>
    restore_value: false
  - id: cat_sizes
    type: std::vector<int>
    restore_value: false

font:
  - file: "../addon/app/fonts/Lato-Bold.ttf"
    id: diag_big
    size: 56
  - file: "../addon/app/fonts/Lato-Regular.ttf"
    id: diag_small
    size: 26

logger:

# Lets Home Assistant push the panel instead of it only ever pulling on a
# timer -- so "Re-render now" on the dashboard updates the screen at once.
api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: refresh_now
      then:
        - script.execute: refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: |-
            if (index >= 0 && index < id(page_count)) id(page) = index;
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
        sub: int
      then:
        - lambda: |-
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            if (category >= 0 && category < cats) {
              id(cat_idx) = category;
              int sz = (category < id(cat_sizes).size()) ? id(cat_sizes)[category] : 1;
              id(sub_idx) = (sub >= 0 && sub < sz) ? sub : 0;
              int off = (category < id(cat_offsets).size()) ? id(cat_offsets)[category] : category;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    # Relative paging, for remotes.
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: |-
            int n = id(page_count) > 0 ? id(page_count) : 1;
            id(page) = ((id(page) + delta) % n + n) % n;
        - script.execute: redraw

    - action: category_step
      variables:
        delta: int
      then:
        - lambda: |-
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            id(cat_idx) = ((id(cat_idx) + delta) % cats + cats) % cats;
            id(sub_idx) = 0;
            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
            if (off < id(page_count)) id(page) = off;
        - script.execute: redraw

    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: |-
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = ((id(sub_idx) + delta) % sz + sz) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    - action: hold_toggle
      then:
        - lambda: 'id(pinned) = !id(pinned);'
        - script.execute: redraw

    - action: category_pin_toggle
      then:
        - lambda: 'id(cat_pinned) = !id(cat_pinned);'
        - script.execute: redraw

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 10
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      if (id(have_frames)) {
        // Read only the rows we need.
        const int off = ${page_h} * id(page);
        for (int y = 0; y < ${page_h}; y++) {
          for (int x = 0; x < 792; x++) {
            it.draw_pixel_at(x, y, id(frames).get_pixel(x, y + off));
          }
        }
        // Held exact page indicator (lock icon)
        if (id(pinned)) {
          it.filled_rectangle(761, 12, 5, 20);     // shackle, left
          it.filled_rectangle(778, 12, 5, 20);     // shackle, right
          it.filled_rectangle(761, 12, 22, 5);     // shackle, top
          it.filled_rectangle(754, 30, 36, 26);    // body
          it.filled_circle(772, 40, 4, COLOR_OFF);         // keyhole
          it.filled_rectangle(770, 40, 4, 10, COLOR_OFF);  // keyhole stem
        } else if (id(cat_pinned)) {
          // Pinned category badge (Apple concentric continuous badge)
          it.filled_rectangle(750, 14, 36, 22);
          it.filled_rectangle(752, 16, 32, 18, COLOR_OFF);
          it.filled_rectangle(758, 20, 20, 10);
        }
      } else if (id(have_single)) {
        // Strip missing -- fall back to whatever single frame HA is serving.
        it.image(0, 0, id(frame));
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.printf(40, 170, id(diag_small), "waiting for %s", "frames.png");
      }

http_request:
  verify_ssl: false
  timeout: 15s
  buffer_size_rx: 8192

online_image:
  - id: frames
    url: ${frames_url}
    format: png
    type: BINARY
    buffer_size: 32768
    on_download_finished:
      - lambda: |-
          int h = id(frames).get_height();
          id(page_count) = (h >= ${page_h}) ? h / ${page_h} : 1;
          if (id(page) >= id(page_count)) id(page) = 0;
          id(have_frames) = true;
          if (id(cat_offsets).empty() || id(cat_count) <= 0) {
            id(cat_offsets).clear();
            id(cat_sizes).clear();
            id(cat_count) = id(page_count);
            for (int i = 0; i < id(page_count); i++) {
              id(cat_offsets).push_back(i);
              id(cat_sizes).push_back(1);
            }
          }
          ESP_LOGI("panel", "%d pages (%d categories) held locally", id(page_count), id(cat_count));
      - component.update: epd
    on_error:
      - logger.log: "frames.png missing - falling back to single frame"
      - component.update: frame

  - id: frame
    url: ${frame_url}
    format: png
    type: BINARY
    buffer_size: 32768
    on_download_finished:
      - lambda: 'id(have_single) = true;'
      - component.update: epd
    on_error:
      - logger.log: "frame.png failed too - retrying in 20s"
      - component.update: epd
      - delay: 20s
      - script.execute: refetch

binary_sensor:
  # Five discrete push-buttons:
  # Dial Rotate Right (GPIO 4): Next Category
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms]
    on_press:
      - logger.log: "KEY next (category right)"
      - lambda: |-
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          id(cat_idx) = (id(cat_idx) + 1) % cats;
          id(sub_idx) = 0;
          int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
          if (off < id(page_count)) id(page) = off;
      - script.execute: redraw

  # Dial Rotate Left (GPIO 6): Previous Category
  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms]
    on_press:
      - logger.log: "KEY prev (category left)"
      - lambda: |-
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          id(cat_idx) = (id(cat_idx) - 1 + cats) % cats;
          id(sub_idx) = 0;
          int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
          if (off < id(page_count)) id(page) = off;
      - script.execute: redraw

  # Dial Center Push (GPIO 5): Short Click = Next Sub-item; Long Hold (>1000ms) = Pin Category
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms]
    on_click:
      - min_length: 30ms
        max_length: 600ms
        then:
          - logger.log: "KEY ok: short click (step sub-item)"
          - lambda: |-
              int c_idx = id(cat_idx);
              int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
              if (sz > 1) {
                id(sub_idx) = (id(sub_idx) + 1) % sz;
                int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                int p = off + id(sub_idx);
                if (p < id(page_count)) id(page) = p;
                ESP_LOGI("panel", "Sub-item stepped to %d/%d (page %d)", id(sub_idx) + 1, sz, id(page));
              } else {
                ESP_LOGI("panel", "Category %d has only 1 item", c_idx);
              }
          - script.execute: redraw
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - logger.log: "KEY ok: long hold (toggle category pin)"
          - lambda: |-
              id(cat_pinned) = !id(cat_pinned);
              ESP_LOGI("panel", "Category pin toggled: %d", id(cat_pinned));
          - script.execute: redraw

  # Menu Button (GPIO 2): Short Click = Pin Exact Page; Long Hold (>1000ms) = Force Refetch Now
  - platform: gpio
    id: key_home
    internal: true
    pin: {number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms]
    on_click:
      - min_length: 30ms
        max_length: 600ms
        then:
          - logger.log: "KEY menu: short click (toggle item pin)"
          - lambda: |-
              id(pinned) = !id(pinned);
              ESP_LOGI("panel", "Item pin toggled: %d", id(pinned));
          - script.execute: redraw
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - logger.log: "KEY menu: long hold (force refetch)"
          - script.execute: refetch

  # Exit Button (GPIO 1): Reset to Category 0, Clear All Pins
  - platform: gpio
    id: key_exit
    internal: true
    pin: {number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms]
    on_press:
      - logger.log: "KEY exit: reset to category 0, clear pins"
      - lambda: |-
          id(pinned) = false;
          id(cat_pinned) = false;
          id(cat_idx) = 0;
          id(sub_idx) = 0;
          id(page) = 0;
      - script.execute: redraw

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

  - platform: homeassistant
    id: ha_cat_count
    entity_id: sensor.epaper_category_count
    on_value:
      then:
        - lambda: |-
            int n = (int)x;
            if (n > 0) {
              id(cat_count) = n;
              if (id(cat_idx) >= n) id(cat_idx) = 0;
            }

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

  - platform: homeassistant
    id: ha_cat_offsets
    entity_id: sensor.epaper_category_offsets
    on_value:
      then:
        - lambda: |-
            id(cat_offsets).clear();
            std::stringstream ss(x);
            std::string item;
            while (std::getline(ss, item, ',')) {
              if (!item.empty()) id(cat_offsets).push_back(atoi(item.c_str()));
            }
            if (id(cat_offsets).empty()) id(cat_offsets).push_back(0);

  - platform: homeassistant
    id: ha_cat_sizes
    entity_id: sensor.epaper_category_sizes
    on_value:
      then:
        - lambda: |-
            id(cat_sizes).clear();
            std::stringstream ss(x);
            std::string item;
            while (std::getline(ss, item, ',')) {
              if (!item.empty()) id(cat_sizes).push_back(atoi(item.c_str()));
            }
            if (id(cat_sizes).empty()) id(cat_sizes).push_back(1);

script:
  - id: redraw
    mode: restart
    then:
      - delay: 250ms
      - component.update: epd

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - component.update: frames

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "min"
    mode: box

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              static int elapsed_sec = 0;
              elapsed_sec += 10;
              int target_sec = (int)(id(panel_refresh_interval).state * 60.0);
              if (target_sec < 10) target_sec = 10;
              if (elapsed_sec >= target_sec) {
                elapsed_sec = 0;
                return true;
              }
              return false;
          then:
            - if:
                condition:
                  lambda: 'return !id(pinned);'
                then:
                  - if:
                      condition:
                        lambda: 'return id(cat_pinned);'
                      then:
                        - lambda: |-
                            int c_idx = id(cat_idx);
                            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
                            if (sz > 1) {
                              id(sub_idx) = (id(sub_idx) + 1) % sz;
                              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                              int p = off + id(sub_idx);
                              if (p < id(page_count)) id(page) = p;
                            }
                        - script.execute: redraw
                      else:
                        - lambda: |-
                            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
                            id(cat_idx) = (id(cat_idx) + 1) % cats;
                            id(sub_idx) = 0;
                            int off = (id(cat_idx) < id(cat_offsets).size()) ? id(cat_offsets)[id(cat_idx)] : id(cat_idx);
                            if (off < id(page_count)) id(page) = off;
                        - script.execute: redraw
            - script.execute: refetch

# ---------------------------------------------------------------------------
# STAGE 3: battery. Uncomment, delete the interval: block above, and add
#   - deep_sleep.enter: sleeper
# to both on_download_finished and on_error.
#
# deep_sleep:
#   id: sleeper
#   run_duration: 30s
#   sleep_duration: 5min
#   esp32_ext1_wakeup:
#     pins:
#       - {number: 4, mode: {input: true, pullup: true}}
#       - {number: 6, mode: {input: true, pullup: true}}
#       - {number: 5, mode: {input: true, pullup: true}}
#       - {number: 2, mode: {input: true, pullup: true}}
#       - {number: 1, mode: {input: true, pullup: true}}
#     mode: ANY_LOW
# ---------------------------------------------------------------------------
