# CrowPanel 5.79" (DIS08792E, 792x272) e-paper panel, generated by the E-paper panel add-on 0.9.3.
#
# Install it from the ESPHome Device Builder. To change it, use the add-on's
# Panel setup rather than editing here: the add-on rewrites this file and keeps
# the previous one next to it as <name>.yaml.previous.
#
# The panel downloads every page of the rotation in one frame file, keeps it in
# memory and shows one page at a time, so paging with the dial needs no
# network. Downloads run in the background; the buttons never wait on them.

substitutions:
  name: crowpanel-epaper
  frames_url: "http://homeassistant.local:8099/frames.epf"

esphome:
  name: ${name}
  friendly_name: E-paper panel
  on_boot:
    priority: -100
    then:
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Pinned to the add-on's release, so the panel and the add-on always speak the
# same version of the frame format.
external_components:
  - source: github://bek00letz/epaper-panel@v0.9.3
    components: [epf]
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2@319ad7c6ffc5e15092c7fbff2ce2b7f4500efc05

epf:

font:
  - file: "gfonts://Lato@700"
    id: diag_big
    size: 56
  - file: "gfonts://Lato@400"
    id: diag_small
    size: 26

logger:

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: refresh_now
      then:
        - script.execute: request_refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: 'epf::PanelController::instance().show_page(index);'
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
        sub: int
      then:
        - lambda: 'epf::PanelController::instance().show_category(category, sub);'
        - script.execute: redraw
    # Relative paging, for remotes and Home Assistant automations.
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().page_step(delta);'
        - script.execute: redraw
    - action: mode_toggle
      then:
        - lambda: 'epf::PanelController::instance().mode_toggle();'
        - script.execute: redraw
    - action: category_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().category_step(delta);'
        - script.execute: redraw
    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: 'epf::PanelController::instance().sub_step(delta);'
        - script.execute: redraw
    - action: hold_toggle
      then:
        - lambda: 'epf::PanelController::instance().hold_toggle();'
        - script.execute: redraw
    - action: category_pin_toggle
      then:
        - lambda: 'epf::PanelController::instance().category_pin_toggle();'
        - script.execute: redraw
    - action: lock_toggle
      then:
        - lambda: 'epf::PanelController::instance().lock_toggle();'
        - script.execute: redraw

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

# GPIO7 powers the display; nothing renders until it is high.
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 10
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      auto &panel = epf::PanelController::instance();
      auto &client = epf::EpfClient::instance();
      if (client.blit(id(epd), panel.page())) {
        client.draw_overlays(id(epd), panel.overlay_state());
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.print(40, 170, id(diag_small), "waiting for frames");
      }

# The five controls are discrete push-buttons (Elecrow's 5.79_key demo), all
# active-low. Which is "next" depends on how the panel is mounted.
binary_sensor:
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PanelController::instance().page_step(1);'
      - script.execute: redraw

  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - lambda: 'epf::PanelController::instance().page_step(-1);'
      - script.execute: redraw

  # Dial centre: hold 1 s to switch between categories and their items. A short
  # press does nothing, so tilting the dial while scrolling can't switch modes.
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 30ms, delayed_off: 30ms]
    on_click:
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: 'epf::PanelController::instance().mode_toggle();'
          - script.execute: redraw

  # Top button: click locks the category, hold locks the page.
  - platform: gpio
    id: key_top
    internal: true
    pin: {number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().category_pin_toggle();'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - lambda: 'epf::PanelController::instance().hold_toggle();'
          - script.execute: redraw

  # Bottom button: click goes to the first page, hold downloads new frames now.
  - platform: gpio
    id: key_bottom
    internal: true
    pin: {number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - lambda: 'epf::PanelController::instance().reset_home();'
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - script.execute: refetch

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "min"
    mode: box

script:
  - id: redraw
    mode: restart
    then:
      - delay: 80ms
      - lambda: 'epf::PanelController::instance().clear_pending_redraw();'
      - component.update: epd

  # Home Assistant asked for new frames. While someone is scrolling, wait
  # until they stop so the pages don't change under them.
  - id: request_refetch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto &panel = epf::PanelController::instance();
              if (!panel.should_defer_refetch()) return true;
              panel.set_pending_refetch(true);
              ESP_LOGI("panel", "Scrolling: downloading new frames once it stops");
              return false;
          then:
            - script.execute: refetch

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.set_pending_refetch(false);
          panel.reset_fetch_idle();
          if (!epf::EpfClient::instance().start_fetch("${frames_url}", id(epd)))
            ESP_LOGD("panel", "A download is already running");

interval:
  # Pick up a finished download. Cheap when there is none.
  - interval: 200ms
    then:
      - lambda: |-
          epf::FetchResult result;
          auto &client = epf::EpfClient::instance();
          if (!client.poll(result)) return;
          auto &panel = epf::PanelController::instance();
          if (result == epf::FetchResult::OK) {
            panel.on_stream_loaded(client.stream());
            if (client.is_alert_interrupt() || client.is_force_full_waveform())
              id(epd).force_full_update();
            id(redraw).execute();
          } else if (result != epf::FetchResult::NOT_MODIFIED) {
            int every = std::max(30, (int) (id(panel_refresh_interval).state * 60.0f));
            panel.retry_fetch_in(30, every);
          }

  - interval: 5s
    then:
      - lambda: |-
          auto &panel = epf::PanelController::instance();
          panel.tick_seconds(5);
          if (panel.pending_refetch() && !panel.should_defer_refetch()) {
            ESP_LOGI("panel", "Scrolling stopped: downloading the deferred frames");
            id(refetch).execute();
          }
          if (panel.check_auto_rotate()) id(redraw).execute();
          // The panel's own timer. During quiet hours it stays asleep until
          // the add-on wakes it (the add-on retries until that's delivered).
          if (!panel.quiet_hours_active()) {
            int every = std::max(30, (int) (id(panel_refresh_interval).state * 60.0f));
            if (panel.fetch_idle_sec() >= every) {
              panel.reset_fetch_idle();
              id(request_refetch).execute();
            }
          }
