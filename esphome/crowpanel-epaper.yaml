# CrowPanel 5.79" e-paper living-room panel.
#
# Home Assistant renders every page of the rotation into one tall PNG; the
# panel holds it in PSRAM and blits a slice. Paging with the dial therefore
# needs no network at all -- just a partial refresh, about half a second.
#
# STAGE 2 (this file): still mains-powered, no deep sleep, so it stays
# reachable over OTA. See the bottom for turning it into a battery device.

substitutions:
  name: crowpanel-epaper
  frames_url: "http://homeassistant.local:7410/frames.png"
  frame_url:  "http://homeassistant.local:7410/frame.png"
  page_h: "272"

esphome:
  name: ${name}
  friendly_name: E-paper panel
  on_boot:
    priority: -100
    then:
      - script.execute: refetch

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2

globals:
  - id: have_frames
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: have_single
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: page
    type: int
    restore_value: false
    initial_value: '0'
  - id: page_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: sub_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: cat_pinned
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cat_count
    type: int
    restore_value: false
    initial_value: '1'
  - id: cat_offsets
    type: std::vector<int>
    restore_value: false
  - id: cat_sizes
    type: std::vector<int>
    restore_value: false
  - id: cat_pill_widths
    type: std::vector<int>
    restore_value: false
  - id: cat_sub_pos
    type: std::vector<int>
    restore_value: false
  - id: sub_mode
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: idle_sec
    type: int
    initial_value: '0'
    restore_value: false
  - id: rotate_sec
    type: int
    initial_value: '30'
    restore_value: false
  - id: fetch_idle_sec
    type: int
    initial_value: '0'
    restore_value: false
  - id: user_cool_sec
    type: int
    initial_value: '999'
    restore_value: false
  - id: pending_refetch
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: pending_redraw
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: last_strip_hash
    type: int
    initial_value: '-1'
    restore_value: false
  - id: last_drawn_page
    type: int
    initial_value: '-1'
    restore_value: false
  - id: last_ok_press_ms
    type: uint32_t
    initial_value: '0'
    restore_value: false
  - id: downloading_frames
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: quiet_hours_active
    type: bool
    initial_value: 'false'
    restore_value: false

font:
  - file: "gfonts://Lato@700"
    id: diag_big
    size: 56
  - file: "gfonts://Lato@400"
    id: diag_small
    size: 26

logger:

# Lets Home Assistant push the panel instead of it only ever pulling on a
# timer -- debounced via request_refetch so manual scrolling is never frozen.
api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: refresh_now
      then:
        - script.execute: request_refetch
    - action: show_page
      variables:
        index: int
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            if (index >= 0 && index < id(page_count)) {
              id(page) = index;
              for (int c = (int)id(cat_offsets).size() - 1; c >= 0; c--) {
                if (index >= id(cat_offsets)[c]) {
                  id(cat_idx) = c;
                  id(sub_idx) = index - id(cat_offsets)[c];
                  break;
                }
              }
            }
        - script.execute: redraw
    - action: show_category
      variables:
        category: int
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            if (category >= 0 && category < cats) {
              id(cat_idx) = category;
              int sz = (category < id(cat_sizes).size()) ? id(cat_sizes)[category] : 1;
              id(sub_idx) = 0;
              int off = (category < id(cat_offsets).size()) ? id(cat_offsets)[category] : category;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    # Relative paging, for remotes (hierarchical: category mode vs sub-item mode).
    - action: page_step
      variables:
        delta: int
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            if (id(cat_idx) >= cats) id(cat_idx) = 0;

            if (id(sub_mode)) {
              int c_idx = id(cat_idx);
              int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
              if (sz > 1) {
                id(sub_idx) = ((id(sub_idx) + delta) % sz + sz) % sz;
                if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
                id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
                int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                int p = off + id(sub_idx);
                if (p < id(page_count)) id(page) = p;
              }
            } else {
              id(cat_idx) = ((id(cat_idx) + delta) % cats + cats) % cats;
              int c_idx = id(cat_idx);
              int sz = (c_idx < id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
              if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
              id(sub_idx) = (sz > 1) ? (id(cat_sub_pos)[c_idx] % sz) : 0;
              id(sub_mode) = false;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    - action: mode_toggle
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_mode) = !id(sub_mode);
              ESP_LOGI("panel", "Navigation mode toggled: sub_mode=%d (sz=%d)", id(sub_mode), sz);
            } else {
              id(sub_mode) = false;
              ESP_LOGI("panel", "Single-page category (sz=%d), staying in category mode", sz);
            }
        - script.execute: redraw

    - action: category_step
      variables:
        delta: int
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            id(cat_idx) = ((id(cat_idx) + delta) % cats + cats) % cats;
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
            if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
            id(sub_idx) = (sz > 1) ? (id(cat_sub_pos)[c_idx] % sz) : 0;
            id(sub_mode) = false;
            int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
            int p = off + id(sub_idx);
            if (p < id(page_count)) id(page) = p;
        - script.execute: redraw

    - action: sub_step
      variables:
        delta: int
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = ((id(sub_idx) + delta) % sz + sz) % sz;
              if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
              id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
        - script.execute: redraw

    - action: hold_toggle
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            id(pinned) = !id(pinned);
            if (id(pinned)) id(cat_pinned) = false;
            ESP_LOGI("panel", "Panel lock: %d", id(pinned));
        - script.execute: redraw

    - action: category_pin_toggle
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            id(cat_pinned) = !id(cat_pinned);
            if (id(cat_pinned)) id(pinned) = false;
            ESP_LOGI("panel", "Category lock: %d", id(cat_pinned));
        - script.execute: redraw

    - action: lock_toggle
      then:
        - lambda: |-
            id(idle_sec) = 0;
            id(user_cool_sec) = 0;
            id(pending_redraw) = true;
            if (id(sub_mode)) {
              id(pinned) = !id(pinned);
              if (id(pinned)) id(cat_pinned) = false;
              ESP_LOGI("panel", "Contextual lock (sub_mode): panel lock=%d", id(pinned));
            } else {
              id(cat_pinned) = !id(cat_pinned);
              if (id(cat_pinned)) id(pinned) = false;
              ESP_LOGI("panel", "Contextual lock (cat_mode): cat lock=%d", id(cat_pinned));
            }
        - script.execute: redraw

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 10
    update_interval: never
    auto_clear_enabled: false
    lambda: |-
      if (id(downloading_frames)) {
        return;
      }
      if (id(have_frames)) {
        const int off = ${page_h} * id(page);
        bool is_sub_mode = id(sub_mode);
        const int py0 = 244, py1 = 268;
        const int sub_x0 = 704, sub_x1 = 752;

        int c_idx = id(cat_idx);
        int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
        if (sz <= 1) {
          is_sub_mode = false;
        }

        int cat_w = (c_idx < id(cat_pill_widths).size()) ? id(cat_pill_widths)[c_idx] : 110;
        int cat_x0 = 96;
        int cat_x1 = cat_x0 + cat_w;

        // 1. Fast direct blit of page pixels: ~8 ms (eliminates 368 ms redraw lag!)
        for (int y = 0; y < ${page_h}; y++) {
          for (int x = 0; x < 792; x++) {
            it.draw_pixel_at(x, y, id(frames).get_pixel(x, y + off));
          }
        }

        auto in_rounded_box = [](int px, int py, int x0, int y0, int x1, int y1, int r) -> bool {
          if (px < x0 || px > x1 || py < y0 || py > y1) return false;
          if (px < x0 + r && py < y0 + r) {
            int dx = (x0 + r) - px, dy = (y0 + r) - py;
            return (dx * dx + dy * dy <= r * r);
          }
          if (px > x1 - r && py < y0 + r) {
            int dx = px - (x1 - r), dy = (y0 + r) - py;
            return (dx * dx + dy * dy <= r * r);
          }
          if (px < x0 + r && py > y1 - r) {
            int dx = (x0 + r) - px, dy = py - (y1 - r);
            return (dx * dx + dy * dy <= r * r);
          }
          if (px > x1 - r && py > y1 - r) {
            int dx = px - (x1 - r), dy = py - (y1 - r);
            return (dx * dx + dy * dy <= r * r);
          }
          return true;
        };

        // 2. Invert ONLY the active pill (Category in Category mode; Sub in Sub mode): <1 ms
        if (!is_sub_mode) {
          for (int py = py0; py <= py1; py++) {
            for (int px = cat_x0; px <= cat_x1; px++) {
              if (in_rounded_box(px, py, cat_x0, py0, cat_x1, py1, 4)) {
                int rx = 791 - px;
                int ry = 271 - py;
                if (rx >= 0 && rx < 792 && ry >= 0 && ry < 272) {
                  Color c = id(frames).get_pixel(rx, ry + off);
                  it.draw_pixel_at(rx, ry, (c == COLOR_ON) ? COLOR_OFF : COLOR_ON);
                }
              }
            }
          }
        } else if (sz > 1) {
          for (int py = py0; py <= py1; py++) {
            for (int px = sub_x0; px <= sub_x1; px++) {
              if (in_rounded_box(px, py, sub_x0, py0, sub_x1, py1, 4)) {
                int rx = 791 - px;
                int ry = 271 - py;
                if (rx >= 0 && rx < 792 && ry >= 0 && ry < 272) {
                  Color c = id(frames).get_pixel(rx, ry + off);
                  it.draw_pixel_at(rx, ry, (c == COLOR_ON) ? COLOR_OFF : COLOR_ON);
                }
              }
            }
          }
        }

        // 3. Apple-grade high-contrast solid padlock badge (22x20px)
        auto draw_lock_badge = [&](int bx, int by, int bw, int bh) {
          int cx = bx + bw / 2;
          int cy = by + bh / 2;
          for (int py = by; py < by + bh; py++) {
            for (int px = bx; px < bx + bw; px++) {
              if (in_rounded_box(px, py, bx, by, bx + bw - 1, by + bh - 1, 4)) {
                int dx = px - cx;
                int dy = py - cy;
                bool is_shackle = false;
                if (dy >= -6 && dy <= -2) {
                  if (dy <= -4) {
                    is_shackle = (dx >= -4 && dx <= 3);
                  } else {
                    is_shackle = (dx >= -5 && dx <= -3) || (dx >= 2 && dx <= 4);
                  }
                }
                bool is_body = (dy >= -1 && dy <= 6 && dx >= -6 && dx <= 5);
                bool is_keyhole = false;
                if ((dy >= 1 && dy <= 2 && dx >= -1 && dx <= 0) || (dy >= 3 && dy <= 4 && dx == 0)) {
                  is_keyhole = true;
                }

                Color col = COLOR_ON;
                if ((is_shackle || is_body) && !is_keyhole) {
                  col = COLOR_OFF;
                }

                int rx = 791 - px;
                int ry = 271 - py;
                if (rx >= 0 && rx < 792 && ry >= 0 && ry < 272) {
                  it.draw_pixel_at(rx, ry, col);
                }
              }
            }
          }
        };

        if (id(cat_pinned)) {
          // Category Lock: neatly follows the category pill
          draw_lock_badge(cat_x1 + 8, py0 + 2, 22, 20);
        }

        if (id(pinned)) {
          // Panel Lock: sits to the left of sub-page pill (or corner if single page)
          int lx = (sz > 1) ? (sub_x0 - 8 - 22) : (752 - 22);
          draw_lock_badge(lx, py0 + 2, 22, 20);
        }
      } else if (id(have_single)) {
        // Strip missing -- fall back to whatever single frame HA is serving.
        it.image(0, 0, id(frame));
      } else {
        it.print(40, 40, id(diag_big), "panel alive");
        it.printf(40, 130, id(diag_small), "ip: %s", id(wifi_ip).state.c_str());
        it.printf(40, 170, id(diag_small), "waiting for %s", "frames.png");
      }

http_request:
  verify_ssl: false
  timeout: 15s
  buffer_size_rx: 4096

online_image:
  - id: frames
    url: ${frames_url}
    format: png
    type: BINARY
    buffer_size: 4096
    on_download_finished:
      - lambda: |-
          id(downloading_frames) = false;
          int h = id(frames).get_height();
          id(page_count) = (h >= ${page_h}) ? h / ${page_h} : 1;
          id(have_frames) = true;
          int new_strip_hash = -1;

          // Check if self-describing metadata row is present (height == page_count * page_h + 1)
          if (h >= id(page_count) * ${page_h} + 1) {
            int meta_y = id(page_count) * ${page_h};
            auto read_byte = [&](int byte_idx) -> int {
              int val = 0;
              int start_px = byte_idx * 8;
              for (int b = 0; b < 8; b++) {
                if (start_px + b < 792) {
                  // In PIL mode 1, bit 1 was written as 0 (black in PNG, red < 128 in get_pixel)
                  if (id(frames).get_pixel(start_px + b, meta_y).red < 128) {
                    val |= (1 << (7 - b));
                  }
                }
              }
              return val;
            };

            int magic = read_byte(0);
            if (magic == 0xA5) {
              int num_cats = read_byte(2);
              if (num_cats > 0 && num_cats <= 30) {
                id(cat_offsets).clear();
                id(cat_sizes).clear();
                id(cat_pill_widths).clear();
                id(cat_count) = num_cats;
                if ((int)id(cat_sub_pos).size() < num_cats) {
                  id(cat_sub_pos).resize(num_cats, 0);
                }
                for (int i = 0; i < num_cats; i++) {
                  int off = read_byte(3 + i * 3);
                  int sz = read_byte(3 + i * 3 + 1);
                  int pw = read_byte(3 + i * 3 + 2);
                  id(cat_offsets).push_back(off);
                  id(cat_sizes).push_back(sz);
                  id(cat_pill_widths).push_back(pw > 0 ? pw : 110);
                }
                int base_idx = 3 + num_cats * 3;
                int qh_flag = read_byte(base_idx);
                id(quiet_hours_active) = (qh_flag == 0xA5);
                int r_hi = read_byte(base_idx + 1);
                int r_lo = read_byte(base_idx + 2);
                int r_sec = (r_hi << 8) | r_lo;
                if (r_sec >= 5 && r_sec <= 3600) {
                  id(rotate_sec) = r_sec;
                }
                int h_b0 = read_byte(base_idx + 3);
                int h_b1 = read_byte(base_idx + 4);
                new_strip_hash = (h_b0 << 8) | h_b1;
                ESP_LOGI("panel", "Loaded metadata directly from frames.png: %d categories (rot=%ds, quiet=%d)", num_cats, id(rotate_sec), id(quiet_hours_active));
              }
            }
          }

          if (id(cat_offsets).empty() || id(cat_count) <= 0) {
            id(cat_offsets).clear();
            id(cat_sizes).clear();
            id(cat_pill_widths).clear();
            id(cat_count) = id(page_count);
            if ((int)id(cat_sub_pos).size() < id(page_count)) {
              id(cat_sub_pos).resize(id(page_count), 0);
            }
            for (int i = 0; i < id(page_count); i++) {
              id(cat_offsets).push_back(i);
              id(cat_sizes).push_back(1);
              id(cat_pill_widths).push_back(110);
            }
          }
          if (id(cat_idx) < 0 || id(cat_idx) >= id(cat_count)) id(cat_idx) = 0;
          int c_idx = id(cat_idx);
          int sz = (c_idx < (int)id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
          if (sz <= 1) {
            id(sub_idx) = 0;
            id(sub_mode) = false;
          } else if (id(sub_idx) < 0 || id(sub_idx) >= sz) {
            id(sub_idx) = id(cat_sub_pos)[c_idx] % sz;
          }
          int off = (c_idx < (int)id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
          int p = off + id(sub_idx);
          id(page) = (p >= 0 && p < id(page_count)) ? p : 0;
          ESP_LOGI("panel", "%d pages (%d categories) held locally, showing cat=%d sub=%d page=%d", id(page_count), id(cat_count), id(cat_idx), id(sub_idx), id(page));
          if (new_strip_hash != -1 && new_strip_hash == id(last_strip_hash) && !id(pending_redraw) && id(page) == id(last_drawn_page)) {
            ESP_LOGI("panel", "Strip unchanged (HTTP 304) -- skipping physical e-paper refresh");
          } else {
            id(last_strip_hash) = new_strip_hash;
            id(pending_redraw) = true;
          }
      - if:
          condition:
            lambda: 'return id(pending_redraw);'
          then:
            - script.execute: redraw
    on_error:
      - lambda: 'id(downloading_frames) = false;'
      - if:
          condition:
            lambda: 'return id(have_frames);'
          then:
            - logger.log: "frames.png fetch failed - keeping cached strip in PSRAM"
            - if:
                condition:
                  lambda: 'return id(pending_redraw);'
                then:
                  - script.execute: redraw
          else:
            - logger.log: "frames.png missing - falling back to single frame"
            - component.update: frame

  - id: frame
    url: ${frame_url}
    format: png
    type: BINARY
    buffer_size: 4096
    on_download_finished:
      - lambda: 'id(have_single) = true;'
      - component.update: epd
    on_error:
      - logger.log: "frame.png failed too - retrying in 20s"
      - component.update: epd
      - delay: 20s
      - script.execute: refetch

binary_sensor:
  # Five discrete push-buttons:
  # Dial Rotate Right (GPIO 6 in 180° mount): Forward
  - platform: gpio
    id: key_next
    internal: true
    pin: {number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - logger.log: "KEY next (dial forward)"
      - lambda: |-
          id(idle_sec) = 0;
          id(user_cool_sec) = 0;
          id(pending_redraw) = true;
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          if (id(cat_idx) >= cats) id(cat_idx) = 0;

          if (id(sub_mode)) {
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = (id(sub_idx) + 1) % sz;
              if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
              id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
          } else {
            id(cat_idx) = (id(cat_idx) + 1) % cats;
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
            if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
            id(sub_idx) = (sz > 1) ? (id(cat_sub_pos)[c_idx] % sz) : 0;
            id(sub_mode) = false;
            int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
            int p = off + id(sub_idx);
            if (p < id(page_count)) id(page) = p;
          }
      - script.execute: redraw

  # Dial Rotate Left (GPIO 4 in 180° mount): Backward
  - platform: gpio
    id: key_prev
    internal: true
    pin: {number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_press:
      - logger.log: "KEY prev (dial backward)"
      - lambda: |-
          id(idle_sec) = 0;
          id(user_cool_sec) = 0;
          id(pending_redraw) = true;
          int cats = id(cat_count) > 0 ? id(cat_count) : 1;
          if (id(cat_idx) >= cats) id(cat_idx) = 0;

          if (id(sub_mode)) {
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
            if (sz > 1) {
              id(sub_idx) = (id(sub_idx) - 1 + sz) % sz;
              if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
              id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
              int p = off + id(sub_idx);
              if (p < id(page_count)) id(page) = p;
            }
          } else {
            id(cat_idx) = (id(cat_idx) - 1 + cats) % cats;
            int c_idx = id(cat_idx);
            int sz = (c_idx < id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
            if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
            id(sub_idx) = (sz > 1) ? (id(cat_sub_pos)[c_idx] % sz) : 0;
            id(sub_mode) = false;
            int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
            int p = off + id(sub_idx);
            if (p < id(page_count)) id(page) = p;
          }
      - script.execute: redraw

  # Dial Center Push (GPIO 5): Long Hold (>=1000ms) = Toggle Category vs Sub-item Mode
  # Short press does NOTHING (prevents scroll tilt wobble from accidentally switching modes).
  - platform: gpio
    id: key_ok
    internal: true
    pin: {number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 30ms, delayed_off: 30ms]
    on_click:
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - logger.log: "KEY ok: long hold (toggle category vs sub-item mode)"
          - lambda: |-
               id(idle_sec) = 0;
               id(user_cool_sec) = 0;
               id(pending_redraw) = true;
               int c_idx = id(cat_idx);
               int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
               if (sz > 1) {
                 id(sub_mode) = !id(sub_mode);
                 ESP_LOGI("panel", "Navigation mode toggled: sub_mode=%d (sz=%d)", id(sub_mode), sz);
               } else {
                 id(sub_mode) = false;
                 ESP_LOGI("panel", "Single-page category (sz=%d), staying in category mode", sz);
               }
          - script.execute: redraw

  # Physical Top Button (GPIO 1 in 180° mount): Short Click (<750ms) = Toggle Category Lock; Long Hold (>=750ms) = Toggle Panel Lock
  - platform: gpio
    id: key_top
    internal: true
    pin: {number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - logger.log: "KEY top: short click (toggle category lock)"
          - lambda: |-
              id(idle_sec) = 0;
              id(user_cool_sec) = 0;
              id(pending_redraw) = true;
              id(cat_pinned) = !id(cat_pinned);
              if (id(cat_pinned)) id(pinned) = false;
              ESP_LOGI("panel", "Category lock: %d", id(cat_pinned));
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - logger.log: "KEY top: long hold (toggle panel lock)"
          - lambda: |-
              id(idle_sec) = 0;
              id(user_cool_sec) = 0;
              id(pending_redraw) = true;
              id(pinned) = !id(pinned);
              if (id(pinned)) id(cat_pinned) = false;
              ESP_LOGI("panel", "Panel lock: %d", id(pinned));
          - script.execute: redraw

  # Physical Bottom Button (GPIO 2 in 180° mount): Short Click (<750ms) = First Page; Long Hold (>=750ms) = Force Refetch Now
  - platform: gpio
    id: key_bottom
    internal: true
    pin: {number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 25ms]
    on_click:
      - min_length: 30ms
        max_length: 750ms
        then:
          - logger.log: "KEY bottom: short click (reset to first page)"
          - lambda: |-
              id(idle_sec) = 0;
              id(user_cool_sec) = 0;
              id(pending_redraw) = true;
              id(cat_idx) = 0;
              id(sub_idx) = 0;
              id(page) = 0;
              id(sub_mode) = false;
              ESP_LOGI("panel", "Reset to page 0");
          - script.execute: redraw
      - min_length: 750ms
        max_length: 6000ms
        then:
          - logger.log: "KEY bottom: long hold (force refetch)"
          - lambda: |-
              id(idle_sec) = 0;
              id(fetch_idle_sec) = 0;
              id(pending_refetch) = false;
              id(pending_redraw) = true;
          - script.execute: refetch

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Panel Wi-Fi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: Panel IP

script:
  - id: redraw
    mode: restart
    then:
      - delay: 80ms
      - if:
          condition:
            lambda: 'return !id(downloading_frames);'
          then:
            - lambda: |-
                id(pending_redraw) = false;
                id(last_drawn_page) = id(page);
            - component.update: epd

  - id: request_refetch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (id(downloading_frames)) {
                id(pending_refetch) = true;
                return false;
              }
              if (id(user_cool_sec) < 15) {
                id(pending_refetch) = true;
                ESP_LOGI("panel", "Manual scroll active (cooldown %ds/15s) -- deferring background refetch", id(user_cool_sec));
                return false;
              }
              return true;
          then:
            - script.execute: refetch

  - id: refetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: |-
          id(downloading_frames) = true;
          id(pending_refetch) = false;
          id(fetch_idle_sec) = 0;
      - component.update: frames

number:
  - platform: template
    name: "Refresh interval"
    id: panel_refresh_interval
    icon: "mdi:timer-outline"
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    unit_of_measurement: "min"
    mode: box

interval:
  - interval: 5s
    then:
      - lambda: |-
          id(idle_sec) += 5;
          id(fetch_idle_sec) += 5;
          if (id(user_cool_sec) < 1000) id(user_cool_sec) += 5;
      # 1. If a background refetch was deferred while the user was manually scrolling,
      #    run it now once 15 seconds of scroll inactivity have elapsed.
      - if:
          condition:
            lambda: |-
              return id(pending_refetch) && id(user_cool_sec) >= 15 && !id(downloading_frames);
          then:
            - logger.log: "Manual scroll cooldown complete (15s) -- running deferred background refetch"
            - script.execute: refetch
      # 2. Local PSRAM Page Rotation (every rotate_sec, default 30s):
      #    Blits the next category/sub-item slice directly from PSRAM (~480ms, zero network fetch).
      #    Each category remembers its own sub-item index (cat_sub_pos) so pass 1 shows sub 1/N,
      #    pass 2 shows sub 2/N, etc., unaffected by 1-minute background data updates.
      - if:
          condition:
            lambda: |-
              if (id(quiet_hours_active) || id(downloading_frames) || !id(have_frames)) return false;
              if (id(user_cool_sec) < 15) return false;
              int rot_target = id(rotate_sec) >= 5 ? id(rotate_sec) : 30;
              return (id(idle_sec) >= rot_target);
          then:
            - lambda: |-
                id(idle_sec) = 0;
            - if:
                condition:
                  lambda: 'return !id(pinned);'
                then:
                  - if:
                      condition:
                        lambda: 'return id(cat_pinned);'
                      then:
                        - lambda: |-
                            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
                            int c_idx = id(cat_idx);
                            int sz = (c_idx < id(cat_sizes).size()) ? id(cat_sizes)[c_idx] : 1;
                            if (sz > 1) {
                              id(sub_idx) = (id(sub_idx) + 1) % sz;
                              if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
                              id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
                              int off = (c_idx < id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                              int p = off + id(sub_idx);
                              if (p < id(page_count)) id(page) = p;
                              id(pending_redraw) = true;
                            }
                      else:
                        - lambda: |-
                            int cats = id(cat_count) > 0 ? id(cat_count) : 1;
                            id(cat_idx) = (id(cat_idx) + 1) % cats;
                            int c_idx = id(cat_idx);
                            int sz = (c_idx < (int)id(cat_sizes).size() && id(cat_sizes)[c_idx] > 0) ? id(cat_sizes)[c_idx] : 1;
                            if ((int)id(cat_sub_pos).size() <= c_idx) id(cat_sub_pos).resize(cats, 0);
                            if (sz > 1) {
                              id(sub_idx) = id(cat_sub_pos)[c_idx] % sz;
                              id(cat_sub_pos)[c_idx] = (id(sub_idx) + 1) % sz;
                            } else {
                              id(sub_idx) = 0;
                            }
                            id(sub_mode) = false;
                            int off = (c_idx < (int)id(cat_offsets).size()) ? id(cat_offsets)[c_idx] : c_idx;
                            int p = off + id(sub_idx);
                            if (p < id(page_count)) id(page) = p;
                            id(pending_redraw) = true;
                            ESP_LOGI("panel", "Auto-rotated to cat=%d sub=%d/%d (page=%d)", c_idx, id(sub_idx) + 1, sz, id(page));
                  - if:
                      condition:
                        lambda: 'return id(pending_redraw);'
                      then:
                        - script.execute: redraw
      # 3. Periodic Background Network Data Fetch (every panel_refresh_interval minutes):
      - if:
          condition:
            lambda: |-
              if (id(quiet_hours_active) || id(downloading_frames)) return false;
              int fetch_target = (int)(id(panel_refresh_interval).state * 60.0);
              if (fetch_target < 30) fetch_target = 30;
              return (id(fetch_idle_sec) >= fetch_target);
          then:
            - lambda: 'id(fetch_idle_sec) = 0;'
            - script.execute: request_refetch

# ---------------------------------------------------------------------------
# STAGE 3: battery. Uncomment, delete the interval: block above, and add
#   - deep_sleep.enter: sleeper
# to both on_download_finished and on_error.
#
# deep_sleep:
#   id: sleeper
#   run_duration: 30s
#   sleep_duration: 5min
#   esp32_ext1_wakeup:
#     pins:
#       - {number: 4, mode: {input: true, pullup: true}}
#       - {number: 6, mode: {input: true, pullup: true}}
#       - {number: 5, mode: {input: true, pullup: true}}
#       - {number: 2, mode: {input: true, pullup: true}}
#       - {number: 1, mode: {input: true, pullup: true}}
#     mode: ANY_LOW
