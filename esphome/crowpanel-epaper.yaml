#       - {number: 6, mode: {input: true, pullup: true}}
#       - {number: 5, mode: {input: true, pullup: true}}
#       - {number: 2, mode: {input: true, pullup: true}}
#       - {number: 1, mode: {input: true, pullup: true}}
#     mode: ANY_LOW
